  const presetsView = () => `<header class="hdr"><h1 class="hdr-title page-h">Presets</h1></header>
<div class="scroll"><div class="page"><p class="lede">Type / in any chat to use one. Each is a way of cutting you can ask for by name.</p><ul class="rows">${PRESETS.map(([c, s]) => `<li><button class="row-btn preset-row" type="button" data-act="use-preset" data-cmd="${c}"><span class="cmd">/${c}</span><span class="row-meta">${esc(s)}</span></button></li>`).join('')}</ul></div></div>`;

  const VIEWS = { start: startView, thread: threadView, editor: editorView, key: keyView, prefs: prefsView, brand: brandView, projects: projectsView, presets: presetsView };
  const appHtml = (screen, o = {}) => `<div class="app${o.entering ? ' entering' : ''}" data-dir="${S.dir}" data-screen="${screen}">${navHtml(screen)}<div class="main">${VIEWS[screen](o)}</div></div>`;

  /* ---------- Rendering and moving between screens ---------- */

  function render(o = {}) {
    pause(null);
    clearTimers();
    closeMenus();
    const stage = $('#stage');
    if (S.screen === 'phone') {
      stage.dataset.view = 'phone';
      stage.innerHTML = `<div class="phone-wrap"><div class="phone">${appHtml('start', { phone: true, entering: o.entering })}</div><p class="phone-label">Start, 390 wide</p></div><div class="phone-wrap"><div class="phone">${appHtml('thread', { phone: true, entering: o.entering })}</div><p class="phone-label">Thread, 390 wide</p></div>`;
    } else {
      delete stage.dataset.view;
      if (S.screen === 'thread' && o.replay) { o.live = { file: true, text: 'Find the best moments for Shorts' }; S.thread.busy = true; }
      stage.innerHTML = appHtml(S.screen, o);
    }
    S.vtPoster = null;
    const apps = $$('.app', stage);
    apps.forEach((app) => {
      paintAll(app);
      $$('textarea', app).forEach(autosize);
      if (app.dataset.screen === 'thread') settleThread(app);
      if (app.dataset.screen === 'editor') { layoutStrip(app); paintFrame(app); }
    });
    if (S.screen === 'thread' && o.live) playThread(apps[0], o.replay ? null : o.live);
    if (S.screen === 'editor' && o.replay) later(() => play(apps[0]), 420);
    requestAnimationFrame(() => requestAnimationFrame(() => apps.forEach((a) => a.classList.add('live'))));
    if (o.entering) later(() => apps.forEach((a) => a.classList.remove('entering')), 700);
    syncChrome();
  }

  function go(screen, o = {}) {
    if (!SCREENS.some(([id]) => id === screen)) return;
    const was = document.activeElement;
    const fromStage = was && stage.contains(was);
    const navKey = fromStage && was.closest('.nav') ? was.dataset.go : null;
    const update = () => {
      S.screen = screen;
      render(o);
      if (!fromStage) return;
      const target = (navKey && $(`.nav [data-go="${navKey}"]`, stage))
        || ((screen === 'start' || screen === 'thread') && $('.composer textarea', stage))
        || $('.main h1', stage);
      if (target) {
        if (target.tagName === 'H1') target.tabIndex = -1;
        target.focus({ preventScroll: true });
      }
    };
    if (!document.startViewTransition || o.instant) { update(); return; }
    const root = document.documentElement;
    /* Night Shift cuts between screens; only footage carries across. */
    if (S.dir === 'night') root.setAttribute('data-cut', '');
    try {
      const vt = document.startViewTransition(update);
      vt.finished.finally(() => root.removeAttribute('data-cut'));
    } catch (e) {
      root.removeAttribute('data-cut');
      update();
    }
  }
  function writeHash() {
    try { history.replaceState(null, '', `#${S.dir}-${S.screen}`); } catch (e) { /* sandboxed */ }
  }
  function readHash() {
    const m = /^#(pattern|night|script)-([a-z]+)$/.exec(location.hash);
    if (m && SCREENS.some(([id]) => id === m[2])) return { dir: m[1], screen: m[2] };
    const v = parseInt(new URLSearchParams(location.search).get('v'), 10);
    if (v >= 1 && v <= DIRS.length) return { dir: DIRS[v - 1][0], screen: 'start' };
    return null;
  }

  /* ---------- Toasts and menus ---------- */

  let toastTimer = 0;
  function toast(app, html, ms = 3600) {
    if (!app) return;
    clearTimeout(toastTimer);
    app.querySelector('.toast')?.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML = html;
    app.append(el);
    if (ms) toastTimer = setTimeout(() => leaveToast(el), ms);
    return el;
  }
  function leaveToast(el) {
    el.style.opacity = '0';
    el.style.transform = 'translateY(calc(-6px * var(--travel)))';
    setTimeout(() => el.remove(), 240);
  }

  let openMenu = null;
  function closeMenus(refocus) {
    if (openMenu) {
      const { el, btn } = openMenu;
      el.remove();
      btn.setAttribute('aria-expanded', 'false');
      if (refocus) btn.focus();
      openMenu = null;
    }
    const sm = $('#screens-menu');
    if (sm && !sm.hidden) {
      sm.hidden = true;
      $('.screens-btn').setAttribute('aria-expanded', 'false');
      if (refocus === 'screens') $('.screens-btn').focus();
    }
  }
  function openBrandMenu(btn, byKey) {
    closeMenus();
    const m = document.createElement('div');
    m.className = `menu${byKey ? ' kb' : ''}`;
    m.setAttribute('role', 'menu');
    m.setAttribute('aria-label', 'Brand for this chat');
    m.innerHTML = Object.keys(BRANDS).map((id) => `<button type="button" role="menuitemradio" aria-checked="${id === S.brand}" data-act="pick-brand" data-brand="${id}" tabindex="-1"><span>${id === S.brand ? I('check', 18) : ''}</span><span><strong>${esc(N.brand(id))}</strong><span>${esc(BRANDS[id].what)}</span></span></button>`).join('')
      + `<button type="button" role="menuitem" data-go="brand" tabindex="-1"><span>${I('brand', 18)}</span><span><strong>Edit brands</strong></span></button>`;
    btn.closest('.menu-anchor').append(m);
    btn.setAttribute('aria-expanded', 'true');
    openMenu = { el: m, btn };
    const items = $$('[role^="menuitem"]', m);
    (items.find((x) => x.getAttribute('aria-checked') === 'true') || items[0]).focus();
  }
  function screensMenuHtml() {
    const on = (b) => `aria-pressed="${b}"`;
    return `<p>Screens</p>${SCREENS.map(([id, name]) => `<button type="button" data-screen-go="${id}" aria-current="${id === S.screen}">${name}</button>`).join('')}
<hr><p>Look</p>
<button type="button" data-theme-set="auto" ${on(S.theme === 'auto')}>Match the computer</button>
<button type="button" data-theme-set="light" ${on(S.theme === 'light')}>Light</button>
<button type="button" data-theme-set="dark" ${on(S.theme === 'dark')}>Dark</button>
<button type="button" data-toggle="motion" ${on(S.motion === 'reduce')}>Less motion</button>
<hr><p>Try</p>
<button type="button" data-toggle="worst" ${on(S.worst)}>Worst-case names</button>
<button type="button" data-try="wrong">Paste a wrong key</button>
<button type="button" data-try="saved">A saved key</button>`;
  }
  function toggleScreensMenu(byKey) {
    const sm = $('#screens-menu');
    const btn = $('.screens-btn');
    if (!sm.hidden) { closeMenus(byKey ? 'screens' : false); return; }
    closeMenus();
    sm.innerHTML = screensMenuHtml();
    sm.classList.toggle('kb', byKey);
    sm.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    if (byKey) ($('[aria-current="true"]', sm) || $('button', sm)).focus();
  }

  function applyTheme() {
    const root = document.documentElement;
    if (S.theme === 'auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', S.theme);
    store.set('cl-proto-theme', S.theme);
  }
  function applyMotion() {
    const root = document.documentElement;
    if (S.motion === 'reduce') root.setAttribute('data-motion', 'reduce');
    else root.removeAttribute('data-motion');
    store.set('cl-proto-motion', S.motion);
  }
  function syncChrome() {
    const name = SCREENS.find(([id]) => id === S.screen)[1];
    $('.screens-btn-label').textContent = name;
    $('.screens-btn').setAttribute('aria-label', `Screens. Now showing ${name}`);
    writeHash();
  }

  /* ---------- Slash menu: opened by typing, so it appears at once ---------- */

  function slashUpdate(ta) {
    const comp = ta.closest('.composer');
    const m = /^\/([a-z]*)$/i.exec(ta.value);
    let menu = $('.slash', comp);
    const list = m ? PRESETS.filter(([c]) => c.startsWith(m[1].toLowerCase())) : [];
    if (!list.length) {
      menu?.remove();
      ta.removeAttribute('aria-activedescendant');
      ta.removeAttribute('aria-controls');
      return;
    }
    if (!menu) {
      menu = document.createElement('div');
      menu.className = `slash${comp.dataset.where === 'start' ? ' below' : ''}`;
      menu.setAttribute('role', 'listbox');
      menu.setAttribute('aria-label', 'Presets');
      menu.id = `slash-${++uid}`;
      menu.dataset.sel = '0';
      comp.append(menu);
    }
    const sel = Math.min(+menu.dataset.sel, list.length - 1);
    menu.dataset.sel = String(sel);
    menu.innerHTML = list.map(([c, s], i) => `<button type="button" class="slash-item" role="option" id="${menu.id}-${i}" aria-selected="${i === sel}" data-act="slash-pick" data-cmd="${c}" tabindex="-1"><span class="mono">/${c}</span><span class="summary">${esc(s)}</span></button>`).join('');
    ta.setAttribute('aria-controls', menu.id);
    ta.setAttribute('aria-activedescendant', `${menu.id}-${sel}`);
  }
  function slashPick(ta, cmd) {
    const comp = ta.closest('.composer');
    const where = comp.dataset.where;
    S[where].text = `/${cmd} `;
    $('.slash', comp)?.remove();
    ta.removeAttribute('aria-activedescendant');
    syncComposer(comp);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }

  /* ---------- Events ---------- */

  const stage = $('#stage');
  const appOf = (el) => el.closest('.app');

  document.addEventListener('click', (e) => {
    const t = e.target;
    const byKey = e.detail === 0;
    if (openMenu && !openMenu.el.contains(t) && !openMenu.btn.contains(t)) closeMenus();
    const sm = $('#screens-menu');
    if (!sm.hidden && !sm.contains(t) && !t.closest('.screens-btn')) closeMenus();

    if (t.closest('.screens-btn')) { toggleScreensMenu(byKey); return; }
    const sg = t.closest('[data-screen-go]');
    if (sg) { closeMenus(); go(sg.dataset.screenGo, { instant: true }); return; }
    const th = t.closest('[data-theme-set]');
    if (th) { S.theme = th.dataset.themeSet; applyTheme(); sm.innerHTML = screensMenuHtml(); if (S.screen === 'prefs') render(); return; }
    const tg = t.closest('[data-toggle]');
    if (tg) {
      if (tg.dataset.toggle === 'motion') { S.motion = S.motion === 'reduce' ? 'auto' : 'reduce'; applyMotion(); }
      if (tg.dataset.toggle === 'worst') { S.worst = !S.worst; render(); }
      sm.innerHTML = screensMenuHtml();
      return;
    }
    const tr = t.closest('[data-try]');
    if (tr) {
      closeMenus();
      if (tr.dataset.try === 'wrong') {
        S.key = { value: 'sk-proj-Q2b8mV1xR7tY4nC9wL6eH3aK0sD5fG8jZ1pU7iO4', state: 'empty', kind: '', msg: '' };
        go('key', { instant: true });
        saveKey($('.app', stage));
      } else {
        S.key = { value: 'sk-ant-api03-Xv8Qm2Lr5Tz9Wc1Bn7Hd4Kf6Jp0Sg3Yu8Ea2Io5Rt9Mw4f2a', state: 'saved', kind: '', msg: '' };
        go('key', { instant: true });
      }
      return;
    }

    const navTo = t.closest('[data-go]');
    if (navTo) { closeMenus(); go(navTo.dataset.go); return; }

    const act = t.closest('[data-act]');
    const segBtn = t.closest('[data-seg]');
    const app = appOf(t);
    if (segBtn && app) { pickSeg(app, segBtn); return; }
    if (!act || !app) return;
    const a = act.dataset.act;
    const comp = act.closest('.composer');
    switch (a) {
      case 'attach': { const w = comp.dataset.where; S[w].file = true; syncComposer(comp); $('textarea', comp).focus(); break; }
      case 'unattach': { const w = comp.dataset.where; S[w].file = false; syncComposer(comp); $('textarea', comp).focus(); break; }
      case 'chip': { const c = $('.composer', app); S.start.text = `/${act.dataset.cmd} `; syncComposer(c); const ta = $('textarea', c); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); break; }
      case 'send': if (comp.dataset.where === 'start') startSend(app); else threadSend(app); break;
      case 'slash-pick': slashPick($('textarea', comp), act.dataset.cmd); break;
      case 'brand-menu': if (openMenu && openMenu.btn === act) closeMenus(true); else openBrandMenu(act, byKey); break;
      case 'pick-brand': {
        S.brand = act.dataset.brand;
        closeMenus(true);
        $$('.brand-btn', stage).forEach((b) => { $('.brand-name', b).textContent = N.brand(); b.setAttribute('aria-label', `Brand for this chat: ${N.brand()}`); });
        toast(app, `<span>New edits in this chat use ${esc(N.brand())}.</span>`);
        break;
      }
      case 'open-clip': {
        if (S.screen === 'phone') return;
        const poster = act.classList.contains('clip-poster') ? act : $(`.clip-poster[data-clip="${act.dataset.clip}"]`, app);
        if (poster) poster.style.viewTransitionName = 'cl-footage';
        go('editor');
        break;
      }
      case 'drop-clip': case 'keep-clip': {
        const i = +act.dataset.clip;
        if (a === 'drop-clip') S.dropped.add(i); else S.dropped.delete(i);
        $$(`.clip[data-clip="${i}"]`, app).forEach((li) => { li.classList.toggle('dropped', S.dropped.has(i)); $('.clip-actions', li).innerHTML = clipActions(i); $('.clip-actions button', li)?.focus(); });
        $$('[data-act="export-all"]', app).forEach((b) => { b.textContent = exportAllLabel(); b.disabled = !keptClips().length; });
        announce(S.dropped.has(i) ? `Dropped ${N.clip(i)}.` : `Kept ${N.clip(i)}.`);
        break;
      }
      case 'export-all': exportAll(app, act); break;
      case 'details': {
        const dl = $('.details', act.closest('.body'));
        const open = dl.hidden;
        dl.hidden = !open;
        act.setAttribute('aria-expanded', String(open));
        act.textContent = open ? 'Hide details' : 'Details';
        break;
      }
      case 'copy': {
        const text = act.dataset.copy === 'desc' ? DESCRIPTION : TITLES[0].join('\n');
        try { navigator.clipboard?.writeText(text).catch(() => {}); } catch (err) { /* no clipboard here */ }
        const label = act.textContent;
        act.style.minWidth = `${act.offsetWidth}px`;
        act.classList.add('copied');
        act.innerHTML = `${I('check', 18)}Copied`;
        announce('Copied.');
        later(() => { act.classList.remove('copied'); act.textContent = label; act.style.minWidth = ''; }, 1600);
        break;
      }
      case 'files': toast(app, '<span>In Cutalong this opens the folder in Finder, with the video and its kit.</span>'); break;
      case 'proto-note': toast(app, `<span>${esc(act.dataset.note)}</span>`); break;
      case 'use-preset': S.start.text = `/${act.dataset.cmd} `; go('start'); break;
      case 'back': S.vtPoster = 0; pause(app); go('thread'); break;
      case 'play': if (S.ed.playing) pause(app); else play(app); break;
      case 'clear-pick': S.ed.pick = null; refreshEditor(app, ['side']); break;
      case 'rm-note': S.ed.notes.splice(+act.dataset.i, 1); refreshEditor(app, ['hdr', 'side']); $('.note-input input', app)?.focus(); break;
      case 'apply': applyNotes(app); break;
      case 'ver': pause(app); setVersion(app, +act.dataset.v); break;
      case 'undo': {
        const list = S.ed.versions;
        const at = list.indexOf(S.ed.v);
        if (at > 0) { const prev = list[at - 1]; const was = S.ed.v; setVersion(app, prev); toast(app, `<span>Back to v${prev}.</span><button class="link" type="button" data-act="ver" data-v="${was}">Redo</button>`); }
        else toast(app, '<span>Nothing to undo.</span>');
        break;
      }
      case 'export': {
        pause(app);
        const v = S.ed.v;
        const el = toast(app, `<span>Exporting v${v}</span>${signalHtml(0.05)}`, 0);
        let p = 0.05;
        const tick = () => { p = Math.min(1, p + 0.16 + Math.random() * 0.08); $('.sig', el)?.style.setProperty('--p', p.toFixed(3)); if (p < 1) later(tick, 260); };
        later(tick, 200);
        later(() => toast(app, `<span>Exported v${v}. The upload kit is in the chat.</span><button class="link" type="button" data-go="thread">Show me</button>`, 4200), 1800);
        break;
      }
      case 'save-key': saveKey(app); break;
      case 'replace-key': S.key = { value: '', state: 'empty', kind: '', msg: '' }; $('.key-slot', app).innerHTML = keyStepHtml(); $('.step:last-child', app)?.classList.add('now'); $('#key-input', app)?.focus(); break;
      case 'forget-key': S.key = { value: '', state: 'empty', kind: '', msg: '' }; render(); break;
      case 'rm-never': {
        const gone = S.never[S.brand].splice(+act.dataset.i, 1)[0];
        $('[data-list="never"]', app).innerHTML = neverItems();
        $('[data-form="never"] input', app)?.focus();
        announce(`Removed ${gone}.`);
        break;
      }
      case 'forget': { const li = act.closest('li'); li.remove(); announce('Forgotten.'); break; }
      default: break;
    }
  });

  function pickSeg(app, b) {
    const group = b.closest('[role="radiogroup"]');
    $$('[role="radio"]', group).forEach((r) => { const on = r === b; r.setAttribute('aria-checked', String(on)); r.tabIndex = on ? 0 : -1; });
    const name = b.dataset.seg;
    const v = b.dataset.v;
    if (name === 'theme') { S.theme = v; applyTheme(); }
    if (name === 'transcription') { S.prefs.transcription = v; const h = $('[data-hint="transcription"]', app); if (h) h.textContent = TRANSCRIBE_HINT[v]; }
    if (name === 'browser') S.prefs.browser = v;
    if (name === 'brand') { S.brand = v; render(); $(`[data-seg="brand"][data-v="${v}"]`, stage)?.focus(); }
  }

  function startSend(app) {
    const st = S.start;
    if (!st.text.trim() && !st.file) return;
    const live = { file: st.file, text: st.text.trim() };
    S.start = { text: '', file: false, busy: false };
    S.thread = { text: '', file: false, busy: true };
    go('thread', { live });
  }

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.matches('.composer textarea')) {
      const comp = t.closest('.composer');
      const st = S[comp.dataset.where];
      st.text = t.value;
      autosize(t);
      const send = $('.send', comp);
      send.disabled = st.busy || !(st.text.trim() || st.file);
      slashUpdate(t);
    }
    if (t.id === 'key-input') {
      S.key.value = t.value;
      const save = $('[data-act="save-key"]', appOf(t));
      if (save) save.disabled = !t.value.trim();
    }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('[data-act="motion-switch"]')) { S.motion = t.checked ? 'reduce' : 'auto'; applyMotion(); }
    if (t.matches('[data-act="learn"]')) S.learn = t.checked;
  });

  document.addEventListener('submit', (e) => {
    const f = e.target.closest('[data-form]');
    if (!f) return;
    e.preventDefault();
    const app = appOf(f);
    const input = $('input', f);
    const text = input.value.trim();
    if (!text) return;
    if (f.dataset.form === 'note') {
      S.ed.notes.push({ text, at: S.ed.pick ? [...S.ed.pick] : Math.round(S.ed.t), fresh: true });
      refreshEditor(app, ['hdr', 'side']);
      $('.note-input input', app)?.focus();
      announce(`Note ${S.ed.notes.length} added.`);
    }
    if (f.dataset.form === 'never') {
      S.never[S.brand].push(text);
      $('[data-list="never"]', app).innerHTML = neverItems();
      input.value = '';
      announce(`Added ${text}.`);
    }
  });

  document.addEventListener('pointerdown', (e) => {
    const beats = e.target.closest('.beats');
    if (!beats || e.button !== 0) return;
    const app = appOf(beats);
    e.preventDefault();
    beats.focus({ preventScroll: true });
    beats.setPointerCapture(e.pointerId);
    const picking = e.shiftKey;
    const anchor = timeAtX(beats, e.clientX);
    if (picking) S.ed.pick = [anchor, anchor];
    else S.ed.t = anchor;
    layoutStrip(app);
    paintFrame(app);
    const move = (ev) => {
      const t = timeAtX(beats, ev.clientX);
      if (picking) S.ed.pick = [Math.min(anchor, t), Math.max(anchor, t)];
      else S.ed.t = t;
      layoutStrip(app);
      paintFrame(app);
    };
    const up = () => {
      beats.removeEventListener('pointermove', move);
      beats.removeEventListener('pointerup', up);
      beats.removeEventListener('pointercancel', up);
      if (picking) {
        if (S.ed.pick[1] - S.ed.pick[0] < 0.5) S.ed.pick = null;
        else S.ed.pick = [Math.round(S.ed.pick[0]), Math.round(S.ed.pick[1])];
        refreshEditor(app, ['side']);
      }
    };
    beats.addEventListener('pointermove', move);
    beats.addEventListener('pointerup', up);
    beats.addEventListener('pointercancel', up);
  });

  document.addEventListener('keydown', (e) => {
    const t = e.target;

    if (e.key === 'Escape') {
      if (openMenu) { closeMenus(true); e.preventDefault(); return; }
      if (!$('#screens-menu').hidden) { closeMenus('screens'); e.preventDefault(); return; }
      const slash = t.closest && t.closest('.composer') && $('.slash', t.closest('.composer'));
      if (slash) { slash.remove(); e.preventDefault(); return; }
    }

    if (openMenu && openMenu.el.contains(t) && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Home' || e.key === 'End')) {
      const items = $$('[role^="menuitem"]', openMenu.el);
      const i = items.indexOf(t);
      const next = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items[next].focus();
      e.preventDefault();
      return;
    }
    if (openMenu && e.key === 'Tab') closeMenus();

    if (t.matches && t.matches('.composer textarea')) {
      const comp = t.closest('.composer');
      const menu = $('.slash', comp);
      if (menu) {
        const opts = $$('.slash-item', menu);
        let sel = +menu.dataset.sel;
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
          menu.dataset.sel = String(sel);
          opts.forEach((o, i) => o.setAttribute('aria-selected', String(i === sel)));
          t.setAttribute('aria-activedescendant', opts[sel].id);
          opts[sel].scrollIntoView({ block: 'nearest' });
          e.preventDefault();
          return;
        }
        if (e.key === 'Enter' || e.key === 'Tab') { slashPick(t, opts[sel].dataset.cmd); e.preventDefault(); return; }
      }
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        const app = appOf(t);
        if (comp.dataset.where === 'start') startSend(app); else threadSend(app);
      }
      return;
    }

    if (t.id === 'key-input' && e.key === 'Enter') { e.preventDefault(); saveKey(appOf(t)); return; }

    if (t.matches && t.matches('[role="radio"]') && /^Arrow(Left|Right|Up|Down)$/.test(e.key)) {
      const radios = $$('[role="radio"]', t.closest('[role="radiogroup"]'));
      const i = radios.indexOf(t);
      const next = radios[(i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1) + radios.length) % radios.length];
      e.preventDefault();
      next.focus();
      next.click();
      return;
    }

    if (t.matches && t.matches('.beats')) {
      const app = appOf(t);
      const E = S.ed;
      const T = total(E.v);
      const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (step) {
        e.preventDefault();
        const from = E.t;
        E.t = Math.min(T - 0.1, Math.max(0, E.t + step));
        if (e.shiftKey) {
          const p = E.pick || [from, from];
          E.pick = step > 0 ? [Math.round(p[0]), Math.round(Math.max(p[1], E.t))] : [Math.round(Math.min(p[0], E.t)), Math.round(p[1])];
          refreshEditor(app, ['side']);
        }
        layoutStrip(app);
        paintFrame(app);
        return;
      }
      if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); E.t = e.key === 'Home' ? 0 : T - 0.1; layoutStrip(app); paintFrame(app); return; }
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (E.playing) pause(app); else play(app); return; }
    }

    /* The picker's keys, ignored while typing, in a menu or on the playhead */
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (t.closest && (t.closest('[role="menu"]') || t.closest('.screens-menu') || t.closest('[role="slider"]') || t.closest('[role="radiogroup"]'))) return;
    const num = parseInt(e.key, 10);
    if (num >= 1 && num <= items.length) setActive(num - 1);
    else if (e.key === 'ArrowRight') setActive((current + 1) % items.length);
    else if (e.key === 'ArrowLeft') setActive((current - 1 + items.length) % items.length);
    else if (e.key === 'r' || e.key === 'R') mount(true);
  });

  /* Work clocks: elapsed time beside every running task */
  setInterval(() => {
    $$('.is-working', stage).forEach((w) => {
      if (!w.dataset.start) w.dataset.start = String(performance.now());
      const el = $('.work-time', w);
      if (el) el.textContent = clock((performance.now() - +w.dataset.start) / 1000);
    });
  }, 1000);

  let resizeFrame = 0;
  window.addEventListener('resize', () => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      moveHighlight();
      $$('.app', stage).forEach((app) => { paintAll(app); layoutStrip(app); });
    });
  });
  window.addEventListener('hashchange', () => {
    const h = readHash();
    if (!h || (h.dir === S.dir && h.screen === S.screen)) return;
    S.screen = h.screen;
    setActive(DIRS.findIndex(([id]) => id === h.dir));
  });

  /* ---------- The direction picker (prototype skill, PICKER.md) ---------- */

  const picker = $('.proto-picker');
  const highlight = $('.proto-picker-highlight', picker);
  const items = $$('.proto-picker-item:not(.proto-picker-replay)', picker);
  const replay = $('.proto-picker-replay', picker);
  let current = 0;

  function moveHighlight() {
    const el = items[current];
    const inner = picker.clientWidth - 8;
    highlight.style.setProperty('--hl', `${el.offsetLeft - 4}px`);
    highlight.style.setProperty('--hr', `${inner - (el.offsetLeft - 4 + el.offsetWidth)}px`);
  }
  /* Clear first, render next frame, so entrance animations re-run. Replay also plays the screen's own motion. */
  function mount(replaying) {
    clearTimers();
    pause(null);
    stage.innerHTML = '';
    requestAnimationFrame(() => render({ entering: true, replay: !!replaying }));
  }
  function setActive(i) {
    if (i < 0 || i >= items.length) return;
    current = i;
    S.dir = DIRS[i][0];
    items.forEach((el, j) => {
      el.toggleAttribute('data-active', j === i);
      if (j === i) el.setAttribute('aria-current', 'true');
      else el.removeAttribute('aria-current');
    });
    moveHighlight();
    writeHash();
    mount(false);
  }
  items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
  replay.addEventListener('click', () => mount(true));

  applyTheme();
  applyMotion();
  const first = readHash();
  if (first) S.screen = first.screen;
  setActive(first ? DIRS.findIndex(([id]) => id === first.dir) : 0);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { moveHighlight(); $$('.app', stage).forEach((app) => layoutStrip(app)); });
})();
</script>
