/* ---------- Page and harness ---------- */

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--page);
  color: var(--page-ink);
  font-family: var(--proto-font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 max(16px, env(safe-area-inset-bottom, 0px));
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.band {
  position: relative;
  height: 64px;
  display: flex;
  align-items: center;
}
.screens-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 16px 0 12px;
  border: 0;
  border-radius: 999px;
  background: var(--proto-glass);
  box-shadow: 0 0 0 1px var(--proto-ring) inset, 0 8px 24px var(--proto-drop-1), 0 2px 6px var(--proto-drop-2);
  color: var(--proto-text-on);
  font-family: var(--proto-font);
  font-size: 13px;
  user-select: none;
  -webkit-user-select: none;
  transition: transform 160ms var(--ease-out);
}
.screens-btn:active { transform: scale(0.97); }
.screens-btn:focus-visible { outline: 2px solid var(--proto-focus); outline-offset: 2px; }
.screens-btn svg { flex: 0 0 auto; }
.screens-menu {
  position: absolute;
  top: 56px;
  left: 0;
  z-index: 2147483646;
  width: 236px;
  padding: 8px;
  border-radius: 14px;
  background: var(--proto-glass);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow: 0 0 0 1px var(--proto-ring) inset, 0 8px 24px var(--proto-drop-1), 0 2px 6px var(--proto-drop-2);
  color: var(--proto-text-on);
  font-family: var(--proto-font);
  font-size: 13px;
  transform-origin: 18px 0;
}
.screens-menu p { margin: 8px 12px 4px; color: var(--proto-text); font-size: 12px; }
.screens-menu button {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  height: 32px;
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--proto-text-hover);
  text-align: left;
}
.screens-menu button[aria-current="true"], .screens-menu button[aria-pressed="true"] { background: var(--proto-hi); color: var(--proto-text-on); }
.screens-menu button:focus-visible { outline: 2px solid var(--proto-focus); outline-offset: -2px; }
.screens-menu kbd { font-family: var(--proto-font); color: var(--proto-text); font-size: 12px; }
.screens-menu hr { border: 0; height: 1px; margin: 8px 4px; background: var(--proto-divider); }
@media (hover: hover) and (pointer: fine) {
  .screens-menu button:hover { background: var(--proto-hi); color: var(--proto-text-on); }
}

/* The picker, from the prototype skill's PICKER.md: its values live in the --proto tokens above */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: var(--proto-glass);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px var(--proto-ring) inset,
    0 8px 24px var(--proto-drop-1),
    0 2px 6px var(--proto-drop-2);
  font-family: var(--proto-font);
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 4px;
  right: 4px;
  height: 28px;
  background: var(--proto-hi);
  clip-path: inset(0 var(--hr, 100%) 0 var(--hl, 0) round 999px);
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition: clip-path 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  white-space: nowrap;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--proto-text);
  font: inherit;
  cursor: pointer;
  transition:
    color 150ms ease-out,
    transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (hover: hover) and (pointer: fine) {
  .proto-picker-item:hover {
    color: var(--proto-text-hover);
  }
}
.proto-picker-item:active {
  transform: scale(0.97);
}
.proto-picker-item:focus-visible {
  outline: 2px solid var(--proto-focus);
  outline-offset: 2px;
}
.proto-picker-item[data-active] {
  color: var(--proto-text-on);
}
.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: var(--proto-divider);
}
.proto-picker-replay {
  padding: 0 12px;
  font-size: 14px;
}
.proto-picker[data-position="top"] {
  bottom: auto;
  top: 14px;
  top: calc(14px + env(safe-area-inset-top, 0px));
}
@media (max-width: 560px) {
  .band { height: 104px; align-items: flex-end; padding-bottom: 12px; }
}

/* The app window: one per screen, or two phones side by side */
.window {
  position: relative;
  height: calc(100dvh - 64px - 16px);
  min-height: 600px;
  border-radius: 12px;
  outline: 1px solid var(--page-window-edge);
  overflow: hidden;
}
.window[data-view="phone"] {
  height: auto;
  min-height: 0;
  overflow: visible;
  outline: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 32px;
  padding-block: 8px 72px;
}
.phone-wrap { flex: 0 1 390px; min-width: 0; }
.phone {
  width: 100%;
  height: 780px;
  border-radius: 38px;
  box-shadow: 0 0 0 1px var(--page-window-edge), 0 0 0 9px var(--page), 0 0 0 10px var(--page-window-edge);
  overflow: hidden;
  position: relative;
}
.phone-label { margin: 12px 0 0; text-align: center; color: var(--page-muted); font-size: 13px; }
@media (max-width: 560px) {
  .window { height: calc(100dvh - 104px - 16px); min-height: 560px; }
}

/* ---------- The app: one markup, three worlds ---------- */

/* The window (or a phone) is the container, so its queries can reshape the app grid itself */
.window, .phone { container: app / inline-size; }
.app {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-columns: var(--nav-w, 212px) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.47;
  caret-color: var(--focus);
  scrollbar-color: var(--rule-2) transparent;
  overflow: hidden;
}
.app ::selection { background: var(--selection); color: var(--ink); }
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app h1, .app h2, .app h3 { margin: 0; text-wrap: balance; }
.app p { margin: 0; text-wrap: pretty; }
.app [data-tnum], .tnum { font-variant-numeric: tabular-nums; }

.app[data-dir="pattern"] {
  --bg: var(--pt-desk); --surface: var(--pt-sheet); --surface-2: var(--pt-sheet-2); --surface-3: var(--pt-sheet-2);
  --rule: var(--pt-rule); --rule-2: var(--pt-rule-2);
  --ink: var(--pt-ink); --ink-2: var(--pt-ink-2); --muted: var(--pt-muted);
  --primary: var(--pt-ink); --primary-ink: var(--pt-on-ink);
  --focus: var(--pt-ink); --cut: var(--pt-cut); --pick: var(--pt-trace);
  --error: var(--pt-error); --ok: var(--pt-ok); --well: var(--pt-well); --float: var(--pt-float);
  --selection: color-mix(in oklch, var(--pt-trace) 22%, transparent);
  --user-bg: var(--pt-sheet); --user-ink: var(--pt-ink);
  --f-ui: var(--f-archivo); --f-read: var(--f-archivo); --f-display: var(--f-archivo);
  --r-control: 6px; --r-surface: 10px; --r-chip: 4px; --r-frame: 4px; --r-composer: 10px;
  --nav-w: 212px;
}
.app[data-dir="night"] {
  --bg: var(--ns-paper); --surface: var(--ns-paper-2); --surface-2: var(--ns-paper-3); --surface-3: var(--ns-paper-3);
  --rule: var(--ns-rule); --rule-2: var(--ns-rule-2);
  --ink: var(--ns-ink); --ink-2: var(--ns-ink-2); --muted: var(--ns-muted);
  --primary: var(--ns-signal); --primary-ink: var(--ns-signal-ink);
  --focus: var(--ns-focus); --cut: var(--ns-cut); --pick: var(--ns-signal);
  --error: var(--ns-error); --ok: var(--ns-ok); --well: var(--ns-well); --float: var(--ns-float);
  --selection: color-mix(in oklch, var(--ns-signal) 30%, transparent);
  --user-bg: var(--ns-paper-3); --user-ink: var(--ns-ink);
  --f-ui: var(--f-wide); --f-read: var(--f-wide); --f-display: var(--f-wide);
  --r-control: 0; --r-surface: 0; --r-chip: 0; --r-frame: 0; --r-composer: 0;
  --nav-w: 0px;
  color-scheme: dark;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: 56px minmax(0, 1fr);
}
.app[data-dir="script"] {
  --bg: var(--ls-desk); --surface: var(--ls-page); --surface-2: var(--ls-page-2); --surface-3: var(--ls-page-2);
  --rule: var(--ls-rule); --rule-2: var(--ls-rule-2);
  --ink: var(--ls-ink); --ink-2: var(--ls-ink-2); --muted: var(--ls-muted);
  --primary: var(--ls-ink); --primary-ink: var(--ls-on-ink);
  --focus: var(--ls-ink); --cut: var(--ls-cut); --pick: var(--ls-pick);
  --error: var(--ls-error); --ok: var(--ls-ok); --well: var(--ls-well); --float: var(--ls-float);
  --selection: color-mix(in oklch, var(--ls-rev-2) 80%, transparent);
  --user-bg: var(--ls-ink); --user-ink: var(--ls-on-ink);
  --f-ui: var(--f-figtree); --f-read: var(--f-serif); --f-display: var(--f-figtree);
  --r-control: 999px; --r-surface: 8px; --r-chip: 999px; --r-frame: 6px; --r-composer: 22px;
  --nav-w: 204px;
}

/* ---------- Navigation: a rail (Pattern, Lined Script) or a top bar (Night Shift) ---------- */

.nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  padding: 16px 12px 12px;
  border-right: 1px solid var(--rule);
  background: var(--bg);
  overflow-y: auto;
}
.nav-brand { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; margin-bottom: 12px; }
.wordmark { font-family: var(--f-figtree); font-weight: 800; font-size: 19px; letter-spacing: -0.045em; line-height: 1; color: var(--ink); }
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 36px;
  padding: 0 12px;
  border: 0;
  border-radius: var(--r-control);
  background: transparent;
  color: var(--ink-2);
  font-size: 14px;
  text-align: left;
  transition: background-color var(--t-press) ease, color var(--t-press) ease;
}
.nav-item svg { flex: 0 0 auto; }
.nav-item[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); font-weight: 600; }
.nav-head { margin: 20px 12px 8px; font-size: 12.5px; color: var(--muted); }
.nav-chat {
  display: block;
  height: 32px;
  padding: 0 12px;
  border: 0;
  border-radius: var(--r-control);
  background: transparent;
  color: var(--ink-2);
  font-size: 13.5px;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background-color var(--t-press) ease;
}
.nav-chat[aria-current="page"] { color: var(--ink); font-weight: 600; }
.nav .spacer { flex: 1 1 auto; }
@media (hover: hover) and (pointer: fine) {
  .nav-item:hover, .nav-chat:hover { background: var(--surface-2); color: var(--ink); }
}

.app[data-dir="night"] .nav {
  grid-column: 1;
  grid-row: 1;
  flex-direction: row;
  align-items: center;
  gap: 4px;
  padding: 0 20px;
  border-right: 0;
  border-bottom: 1px solid var(--rule);
  overflow: visible;
}
.app[data-dir="night"] .nav-brand { margin: 0 20px 0 0; padding: 0; }
.app[data-dir="night"] .nav-item { height: 56px; padding: 0 12px; border-radius: 0; gap: 8px; }
.app[data-dir="night"] .nav-item svg { display: none; }
.app[data-dir="night"] .nav-item[aria-current="page"] { background: transparent; box-shadow: inset 0 -2px 0 var(--ink); }
.app[data-dir="night"] .nav-head, .app[data-dir="night"] .nav-chat { display: none; }
.app[data-dir="night"] .nav-item[data-go="prefs"] { margin-left: auto; }

/* ---------- Main column and headers ---------- */

.main { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.app[data-dir="night"] .main { grid-row: 2; }
.hdr {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  padding: 12px 20px;
}
.hdr-title { min-width: 0; font-weight: 650; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .spacer { flex: 1 1 auto; }
.app[data-dir="night"] .hdr { border-bottom: 1px solid var(--rule); min-height: 56px; }
.app[data-dir="night"] .hdr-title { font-weight: 500; font-stretch: 112%; }
.app[data-dir="script"] .hdr-title { font-weight: 700; letter-spacing: -0.01em; }
.hdr-title.page-h { font-family: var(--f-display); font-size: 24px; }
.app[data-dir="pattern"] .hdr-title.page-h { font-weight: 700; font-stretch: 106%; letter-spacing: -0.02em; }
.app[data-dir="night"] .hdr-title.page-h { font-weight: 300; font-stretch: 125%; font-size: 26px; letter-spacing: -0.01em; }
.app[data-dir="script"] .hdr-title.page-h { font-weight: 800; letter-spacing: -0.03em; }

.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 40px;
  padding: 0 20px;
  border: 1px solid transparent;
  border-radius: var(--r-control);
  background: transparent;
  color: var(--ink);
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
  transition:
    background-color var(--t-press) ease,
    border-color var(--t-press) ease,
    color var(--t-press) ease,
    transform var(--t-press) var(--ease-out);
}
.btn:active:not(:disabled) { transform: scale(calc(1 - 0.04 * var(--travel))); }
.btn:disabled { cursor: not-allowed; color: var(--muted); }
.btn-secondary:disabled { background: var(--surface-2); border-color: var(--rule); }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-primary:disabled { background: var(--surface-2); color: var(--muted); border-color: var(--rule); }
.btn-secondary { border-color: var(--rule-2); background: var(--surface); }
.btn-text { padding: 0 12px; color: var(--ink-2); }
.btn-small { height: 34px; padding: 0 16px; font-size: 13.5px; }
.btn-icon { width: 40px; padding: 0; border-color: var(--rule); background: var(--surface); }
.btn .cmd { font-family: var(--f-mono); font-weight: 500; font-size: 13px; }
.app[data-dir="night"] .btn { font-weight: 500; }
.app[data-dir="night"] .btn-text { text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 4px; }
.app[data-dir="script"] .btn-secondary { background: var(--surface); border-color: var(--rule); }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover:not(:disabled) { background: color-mix(in oklch, var(--primary) 86%, var(--bg)); }
  .btn-secondary:hover:not(:disabled), .btn-icon:hover:not(:disabled) { background: var(--surface-2); }
  .btn-text:hover:not(:disabled) { color: var(--ink); background: var(--surface-2); }
  .app[data-dir="night"] .btn-text:hover:not(:disabled) { background: transparent; text-decoration-color: var(--ns-signal); }
}

/* ---------- Chips and facts ---------- */

.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip-cmd {
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--rule-2);
  border-radius: var(--r-chip);
  background: transparent;
  color: var(--ink-2);
  font-family: var(--f-mono);
  font-size: 13px;
  transition: background-color var(--t-press) ease, color var(--t-press) ease, transform var(--t-press) var(--ease-out);
}
.chip-cmd:active { transform: scale(calc(1 - 0.04 * var(--travel))); }
@media (hover: hover) and (pointer: fine) {
  .chip-cmd:hover { background: var(--surface); color: var(--ink); }
}
.fact {
  display: inline-flex;
  align-items: center;
  height: 30px;
  padding: 0 12px;
  border: 1px solid var(--rule);
  border-radius: var(--r-chip);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
}
.app[data-dir="pattern"] .fact { background: transparent; border-color: var(--rule-2); }
.app[data-dir="night"] .fact { background: transparent; border-color: var(--rule-2); color: var(--ink-2); }
.link {
  height: 30px;
  padding: 0 4px;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-weight: 600;
  font-size: 13.5px;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}
.app[data-dir="night"] .link { font-weight: 500; text-decoration-color: var(--ns-signal); }

/* ---------- Composer ---------- */

.composer {
  position: relative;
  width: 100%;
  border: 1px solid var(--rule-2);
  border-radius: var(--r-composer);
  background: var(--surface);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.composer:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.app[data-dir="script"] .composer { box-shadow: var(--ls-float); }
.app[data-dir="night"] .composer { border-color: var(--rule-2); }
.composer textarea {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 52px;
  max-height: 180px;
  padding: 8px 4px;
  border: 0;
  resize: none;
  background: transparent;
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 24px;
  outline: none;
}
.composer[data-where="thread"] textarea { min-height: 40px; }
.composer textarea::placeholder { color: var(--muted); opacity: 1; }
.composer-row { display: flex; align-items: flex-end; gap: 8px; }
.send {
  position: relative;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: var(--r-control);
  background: var(--primary);
  color: var(--primary-ink);
  display: grid;
  place-items: center;
  transition: background-color var(--t-press) ease, color var(--t-press) ease, transform var(--t-press) var(--ease-out);
}
.send:active:not(:disabled) { transform: scale(calc(1 - 0.04 * var(--travel))); }
.send:disabled { cursor: not-allowed; background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule); }
.send.busy:disabled { background: var(--primary); color: var(--primary-ink); box-shadow: none; cursor: progress; }
.send .arrow, .send .busy-mark { display: grid; place-items: center; transition: opacity var(--t-small) var(--ease-out), transform var(--t-small) var(--ease-out); }
@starting-style {
  .live .send .arrow, .live .send .busy-mark { opacity: 0; transform: scale(calc(1 - 0.25 * var(--travel))); }
}
.composer-files { display: flex; flex-wrap: wrap; gap: 8px; }
.attach {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  height: 34px;
  padding: 0 8px 0 4px;
  border: 1px solid var(--rule);
  border-radius: var(--r-chip);
  background: var(--surface-2);
  font-family: var(--f-mono);
  font-size: 12.5px;
  color: var(--ink-2);
}
.attach canvas { width: 26px; height: 26px; border-radius: calc(var(--r-chip) * 0.6); flex: 0 0 auto; }
.attach .name { display: flex; min-width: 0; }
.attach .name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach .name span:last-child { flex: 0 0 auto; white-space: nowrap; }
.attach button { width: 26px; height: 26px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); display: grid; place-items: center; }

/* The slash menu opens from the keyboard, so it appears at once: no transition (Emil: never animate keyboard-initiated UI). */
.slash {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: calc(100% + 8px);
  z-index: 20;
  padding: 8px;
  border: 1px solid var(--rule);
  border-radius: var(--r-surface);
  background: var(--surface);
  box-shadow: var(--float);
}
.slash.below { top: calc(100% + 8px); bottom: auto; }
.slash-item {
  display: flex;
  width: 100%;
  gap: 12px;
  align-items: baseline;
  min-height: 38px;
  padding: 8px 12px;
  border: 0;
  border-radius: calc(var(--r-surface) - 4px);
  background: transparent;
  text-align: left;
}
.slash-item[aria-selected="true"] { background: var(--surface-2); }
.slash-item .mono { font-family: var(--f-mono); font-size: 13px; color: var(--ink); flex: 0 0 auto; }
.slash-item .summary { color: var(--ink-2); font-size: 13.5px; min-width: 0; }
.app[data-dir="night"] .slash-item .mono { font-family: var(--f-wide); font-weight: 500; }

/* ---------- Start ---------- */

.start {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  padding: clamp(32px, 9vh, 104px) 48px 48px;
}
.start-inner { width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.start h1 { font-family: var(--f-display); color: var(--ink); }
.app[data-dir="pattern"] .start h1 { font-size: 56px; line-height: 1; font-weight: 720; font-stretch: 106%; letter-spacing: -0.035em; }
.app[data-dir="night"] .start h1 { font-size: 60px; line-height: 1.04; font-weight: 300; font-stretch: 125%; letter-spacing: -0.015em; }
.app[data-dir="script"] .start h1 { font-size: 52px; line-height: 1.05; font-weight: 800; letter-spacing: -0.045em; }
.start-sub { color: var(--muted); font-size: 15px; }
.continue { width: 100%; max-width: 720px; margin: 40px auto 0; }
/* With the rail's chat list in view, Start offers only the edit you were in */
.app:not([data-dir="night"]) .continue li:nth-child(n + 2) { display: none; }
.continue h2 { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
.app[data-dir="night"] .continue h2 { font-weight: 500; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.rows li { border-bottom: 1px solid var(--rule); }
.row-btn {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr) auto;
  gap: 16px;
  align-items: center;
  width: 100%;
  min-height: 64px;
  padding: 8px 8px;
  border: 0;
  background: transparent;
  text-align: left;
  border-radius: var(--r-control);
  transition: background-color var(--t-press) ease;
}
.row-btn canvas { width: 72px; height: 42px; border-radius: var(--r-frame); display: block; }
.row-title { display: block; font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { display: block; color: var(--muted); font-size: 13px; }
.row-side { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.app[data-dir="night"] .row-title { font-weight: 500; font-stretch: 112%; }
.app[data-dir="script"] .rows { border-top: 0; display: grid; gap: 12px; }
.app[data-dir="script"] .rows li { border: 0; }
.app[data-dir="script"] .row-btn { background: var(--surface); box-shadow: var(--ls-float); border-radius: 8px; padding: 12px 12px; }
@media (hover: hover) and (pointer: fine) {
  .row-btn:hover { background: var(--surface); }
  .app[data-dir="script"] .row-btn:hover { background: var(--surface-2); }
}

/* ---------- Thread ---------- */

.thread-col { width: 100%; max-width: 760px; margin: 0 auto; padding: 24px 24px 40px; display: flex; flex-direction: column; gap: 24px; }
.thread-foot { padding: 0 24px 20px; }
.thread-foot .composer { max-width: 760px; margin: 0 auto; }

.msg-u { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; max-width: 78%; }
.bubble {
  padding: 12px 16px;
  border-radius: 18px 18px 4px 18px;
  background: var(--user-bg);
  color: var(--user-ink);
  font-size: 16px;
  line-height: 1.45;
}
.app[data-dir="pattern"] .bubble { background: var(--pt-well); border-radius: 10px 10px 2px 10px; }
.app[data-dir="night"] .bubble { border-radius: 0; }
.bubble .cmd { font-family: var(--f-mono); font-size: 14.5px; }
.app[data-dir="night"] .bubble .cmd { font-family: var(--f-wide); font-weight: 500; }
.file-tile { display: flex; align-items: center; gap: 12px; max-width: 100%; padding: 8px 12px 8px 8px; border: 1px solid var(--rule); border-radius: var(--r-surface); background: var(--surface); }
.file-tile canvas { width: 64px; height: 36px; border-radius: var(--r-frame); flex: 0 0 auto; }
.file-tile .name { display: flex; min-width: 0; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); }
.file-tile .name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-tile .len { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

.msg-a { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 16px; align-items: start; }
.msg-a:not(.latest) .who { visibility: hidden; }
.app[data-dir="pattern"] .is-working .who { visibility: hidden; }
.who { width: 28px; height: 28px; display: grid; place-items: center; margin-top: 0px; }
.app[data-dir="script"] .who { border-radius: 8px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); }
.app[data-dir="night"] .msg-a { grid-template-columns: minmax(0, 1fr); }
.app[data-dir="night"] .who { display: none; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.reply { font-family: var(--f-read); font-size: 17px; line-height: 1.55; color: var(--ink); max-width: 64ch; }
.app[data-dir="script"] .reply { font-size: 18px; line-height: 1.5; font-optical-sizing: auto; }
.app[data-dir="night"] .reply { font-size: 16.5px; line-height: 1.6; }
.aside { color: var(--muted); font-size: 14.5px; max-width: 64ch; }
.aside .link { height: auto; padding: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.done-note { color: var(--muted); font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.done-note svg { flex: 0 0 auto; }
.details {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 8px 24px;
  margin: 0;
  padding: 16px 20px;
  border: 1px solid var(--rule);
  border-radius: var(--r-surface);
  background: var(--surface);
  font-size: 14px;
}
.details dt { color: var(--muted); }
.details dd { margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.details dd.file { font-family: var(--f-mono); font-size: 12.5px; }
.app[data-dir="night"] .details { background: var(--surface); border-color: var(--rule); }

/* Working: the progress signal differs by direction */
.working { display: flex; align-items: center; gap: 16px; min-height: 28px; }
.work-stage { font-size: 15px; color: var(--ink); }
.work-time { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; min-width: 34px; }
.meter { position: relative; width: 160px; height: 4px; overflow: hidden; border-radius: 2px; background: var(--rule); }
.meter-fill { position: absolute; inset: 0; background: var(--ink); transform-origin: 0 50%; transform: scaleX(var(--p, 0.04)); transition: transform 240ms var(--ease-out); }
.app[data-dir="night"] .meter { height: 2px; border-radius: 0; background: var(--ns-rule-2); }
.app[data-dir="night"] .meter-fill { background: var(--ns-signal); }
.cutline { position: relative; display: block; width: 160px; height: 10px; overflow: hidden; }
.cutline .take { position: absolute; left: 0; top: 4px; width: 100%; height: 2px; border-radius: 1px; background: var(--ink); transform-origin: 0 50%; transform: scaleX(var(--p, 0)); transition: transform 240ms var(--ease-out); }
.cutline .cut { position: absolute; top: 4px; right: 0; left: 0; height: 2px; overflow: hidden; clip-path: inset(0 0 0 calc(var(--p, 0) * 100% + 6px)); transition: clip-path 240ms var(--ease-out); }
.cutline .cut::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; right: -18px; background: repeating-linear-gradient(90deg, var(--cut) 0 5px, transparent 5px 9px); }
.cutline.unknown .cut { clip-path: inset(0); }
.pencil { position: relative; width: 160px; height: 2px; background: var(--rule); overflow: hidden; }
.pencil::after { content: ""; position: absolute; inset: 0; background: var(--ink); transform-origin: 0 50%; transform: scaleX(var(--p, 0.04)); transition: transform 240ms var(--ease-out); }

/* Proof under a claim: what the change did to the cut */
.proof { display: flex; flex-direction: column; gap: 8px; }
.proof-strip { display: flex; gap: 4px; height: 26px; max-width: 520px; }
.proof-beat { flex: var(--w) 1 0; min-width: 6px; border-radius: 3px; background: var(--rule); position: relative; }
.proof-beat.changed { background: var(--ink); }
.proof-beat.gone { background: transparent; box-shadow: inset 0 0 0 1px var(--rule-2); }
.proof-cap { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.app[data-dir="pattern"] .proof-beat { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.app[data-dir="pattern"] .proof-beat.changed { box-shadow: inset 0 0 0 2px var(--ink); }
.app[data-dir="pattern"] .proof-beat.gone { box-shadow: inset 0 0 0 1.5px var(--rule); }
.app[data-dir="pattern"] .proof-beat.gone::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; margin-top: -1px; border-top: 2px dashed var(--ink-2); }
.app[data-dir="night"] .proof-beat { border-radius: 0; background: var(--ns-paper-3); }
.app[data-dir="night"] .proof-beat.changed { background: var(--ns-ink-2); }
.app[data-dir="night"] .proof-beat.gone { background: transparent; box-shadow: none; }
.app[data-dir="night"] .proof-beat.gone::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--ns-rule-2); }
.rev-chip { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 8px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); font-size: 13.5px; color: var(--ink-2); }
.rev-chip i { width: 18px; height: 18px; border-radius: 4px; background: var(--rev); box-shadow: inset 0 0 0 1px var(--ls-rule); }

/* Clip set */
.clips { display: grid; grid-template-columns: repeat(3, minmax(0, 168px)); gap: 16px; }
.clip { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.clip-poster { position: relative; display: block; padding: 0; border: 0; background: var(--well); border-radius: var(--r-frame); overflow: hidden; aspect-ratio: 9 / 16; width: 100%; }
.clip-poster canvas { width: 100%; height: 100%; display: block; }
.clip-poster .len { position: absolute; left: 8px; bottom: 8px; padding: 4px 8px; border-radius: 4px; background: var(--ft-caption-shadow); color: var(--ft-caption); font-size: 12px; font-variant-numeric: tabular-nums; }
.app[data-dir="night"] .clip-poster .len { border-radius: 0; }
.clip-title { font-weight: 650; font-size: 14.5px; line-height: 1.3; }
.app[data-dir="night"] .clip-title { font-weight: 500; }
.clip-quote { color: var(--muted); font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.app[data-dir="script"] .clip-quote { font-family: var(--f-serif); font-size: 14px; }
.clip-actions { display: flex; gap: 4px; }

/* ---------- Editor ---------- */

.ed { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr) auto; gap: 16px; padding: 0 16px 16px; }
.well { position: relative; min-width: 0; min-height: 0; border-radius: var(--r-surface); background: var(--well); display: grid; place-items: center; overflow: hidden; }
.app[data-dir="pattern"] .well { background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); }
.frame { position: relative; height: calc(100% - 40px); aspect-ratio: 9 / 16; max-width: calc(100% - 40px); border-radius: var(--r-frame); overflow: hidden; background: var(--ft-night); }
.app[data-dir="pattern"] .frame { outline: 1.5px solid var(--ink); outline-offset: 5px; }
.app[data-dir="script"] .frame { box-shadow: var(--ls-float); }
.frame canvas { width: 100%; height: 100%; display: block; }
.caption { position: absolute; left: 6%; right: 6%; top: 66%; text-align: center; font-family: var(--f-figtree); font-weight: 800; font-size: clamp(14px, 3.4cqh, 26px); color: var(--ft-caption); text-shadow: 0 2px 12px var(--ft-caption-shadow); pointer-events: none; }
.frame { container-type: size; }
.ver-flash { animation: ver-in 260ms var(--ease-out) both; }
@keyframes ver-in { from { opacity: 0.35; filter: blur(2px); } }

.side { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-radius: var(--r-surface); background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); overflow: hidden; }
.app[data-dir="script"] .side { box-shadow: var(--ls-float); }
.side-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.side-foot { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--rule); }
.status { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; }
.app[data-dir="night"] .status { grid-template-columns: minmax(0, 1fr); }
.app[data-dir="night"] .status .who { display: none; }
.status .reply { font-size: 15px; line-height: 1.5; }
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.note { display: grid; grid-template-columns: 24px minmax(0, 1fr) 28px; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--rule); }
.note:last-child { border-bottom: 1px solid var(--rule); }
.note-n { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule-2); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
.app[data-dir="pattern"] .note-n { border-radius: 3px; font-stretch: 75%; font-size: 13px; }
.app[data-dir="night"] .note-n { border-radius: 0; }
.note-text { font-size: 14.5px; line-height: 1.4; }
.note-where { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.note-x { width: 28px; height: 28px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); display: grid; place-items: center; }
.picked-line { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.picked-line .tc { font-family: var(--f-mono); color: var(--pick); font-size: 12.5px; }
.app[data-dir="night"] .picked-line .tc { font-family: var(--f-wide); }
.picked-line .spacer { flex: 1 1 auto; }
.note-input { display: flex; gap: 8px; align-items: center; }
.note-input .input { flex: 1 1 auto; height: 40px; }
.note-input .send { flex: 0 0 auto; }

/* The strip: one block per beat, the playhead, a picked stretch */
.strip { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: var(--r-surface); background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); }
.play { width: 40px; height: 40px; border: 0; border-radius: 999px; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; flex: 0 0 auto; }
.app[data-dir="pattern"] .play { background: var(--ink); color: var(--pt-on-ink); }
.app[data-dir="night"] .play { border-radius: 0; background: var(--ns-ink); color: var(--ns-paper); }
.tc-now { font-family: var(--f-mono); font-size: 13px; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tc-now .tc-of { color: var(--muted); }
.app[data-dir="night"] .tc-now { font-family: var(--f-wide); font-size: 14px; }
.beats { position: relative; flex: 1 1 auto; min-width: 0; display: flex; gap: 4px; height: 44px; container-type: inline-size; touch-action: none; cursor: pointer; }
.beat {
  position: relative;
  flex: var(--w) 1 0;
  min-width: 4px;
  border: 0;
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 12px;
  line-height: 44px;
  padding: 0 8px;
  text-align: left;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.beat.on { background: var(--ink); color: var(--surface); font-weight: 600; }
.beat.picked:not(.on) { color: var(--ink); }
.playhead { position: absolute; top: -6px; bottom: -6px; left: 0; width: 2px; margin-left: -0px; background: var(--cut); pointer-events: none; will-change: transform; }
.pick-bar { position: absolute; bottom: -7px; height: 3px; border-radius: 2px; background: var(--pick); pointer-events: none; }
/* Pattern: pieces drawn as outlines, numbered, joined at notches; a picked stretch is a dotted tracing */
.app[data-dir="pattern"] .beat { background: transparent; box-shadow: inset 0 0 0 1.5px var(--rule-2); border-radius: 3px; padding: 0 8px 0 24px; color: var(--ink-2); }
.app[data-dir="pattern"] .beat::before { content: attr(data-n); position: absolute; left: 7px; top: 50%; transform: translateY(-50%); font-stretch: 75%; font-weight: 700; font-size: 12px; color: var(--muted); }
.app[data-dir="pattern"] .beat.on { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2.5px var(--ink); }
.app[data-dir="pattern"] .beat.on::before { color: var(--ink); }
.app[data-dir="pattern"] .beat + .beat::after { content: ""; position: absolute; left: -4px; top: -1px; border: 3px solid transparent; border-top: 4px solid var(--rule-2); }
.app[data-dir="pattern"] .pick-bar { top: -6px; bottom: -6px; height: auto; margin-left: -4px; padding-right: 8px; box-sizing: content-box; border-radius: 6px; background: transparent; border: 2px dotted var(--pick); }
/* Night Shift: lit frames, square; the stretch takes the signal's underline */
.app[data-dir="night"] .beat { border-radius: 0; background: var(--ns-paper-3); color: var(--ns-muted); }
.app[data-dir="night"] .beat.on { background: var(--ns-ink-2); color: var(--ns-paper); }
.app[data-dir="night"] .beat.picked:not(.on) { color: var(--ns-ink); }
.app[data-dir="night"] .pick-bar { border-radius: 0; height: 2px; bottom: -6px; }
/* Lined Script: blocks wear the current revision's colour */
.app[data-dir="script"] .beat { background: var(--rev, var(--ls-page-2)); box-shadow: inset 0 0 0 1px var(--ls-rule); color: var(--ink-2); }
.app[data-dir="script"] .beat.on { background: var(--ink); color: var(--ls-page); box-shadow: none; }
.app[data-dir="pattern"] .playhead { width: 2px; }

.versions { display: flex; align-items: center; gap: 4px; min-width: 0; }
.ver {
  height: 30px;
  padding: 0 12px;
  border: 0;
  border-radius: var(--r-chip);
  background: transparent;
  color: var(--muted);
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  transition: background-color var(--t-press) ease, color var(--t-press) ease;
}
.ver[aria-pressed="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule-2); font-weight: 600; }
.app[data-dir="pattern"] .ver { border-radius: 3px; }
.app[data-dir="pattern"] .ver[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); background: transparent; }
.app[data-dir="night"] .ver { border-radius: 0; }
.app[data-dir="night"] .ver[aria-pressed="true"] { background: var(--ns-paper-3); box-shadow: none; font-weight: 500; }
.app[data-dir="script"] .ver { position: relative; padding: 0 12px; border-radius: 6px 6px 0 0; background: var(--rev); box-shadow: inset 0 0 0 1px var(--ls-rule); color: var(--ink-2); }
.app[data-dir="script"] .ver[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.ver-label { color: var(--muted); font-size: 13px; margin-right: 4px; }
@media (hover: hover) and (pointer: fine) {
  .ver:hover { color: var(--ink); }
  .beat:hover { color: var(--ink); }
}

/* Lined Script: the script page with ruled beats in the margin */
.script-page { display: flex; flex-direction: column; gap: 0; }
.sline { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 8px 0; }
.sline .bn { position: relative; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; padding-right: 12px; }
.sline .bn::after { content: ""; position: absolute; right: 0; top: 2px; bottom: -8px; width: 1.5px; background: var(--ink-2); }
.sline.picked .bn::after { background: var(--pick); width: 3px; }
.sline .words { font-family: var(--f-serif); font-size: 16.5px; line-height: 1.5; color: var(--ink); }
.sline.on .words { text-decoration: underline; text-decoration-color: var(--ink-2); text-underline-offset: 4px; }
.struck { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--ink-2); text-decoration-thickness: 1.5px; }
.margin-note { margin: 0 0 8px 48px; padding: 0; color: var(--ink-2); font-family: var(--f-serif); font-style: italic; font-size: 15px; line-height: 1.45; }
.margin-note b { flex: 0 0 auto; display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 4px; background: var(--ls-rev-4); color: var(--ink); font-family: var(--f-figtree); font-style: normal; font-size: 12px; }

/* ---------- Key setup ---------- */

.page { width: 100%; max-width: 720px; margin: 0 auto; padding: 36px 32px 64px; display: flex; flex-direction: column; gap: 24px; }
.page-title { font-family: var(--f-display); font-size: 34px; line-height: 1.1; color: var(--ink); }
.app[data-dir="pattern"] .page-title { font-weight: 700; font-stretch: 106%; letter-spacing: -0.03em; }
.app[data-dir="night"] .page-title { font-weight: 300; font-stretch: 125%; letter-spacing: -0.015em; font-size: 38px; }
.app[data-dir="script"] .page-title { font-weight: 800; letter-spacing: -0.04em; }
.lede { color: var(--ink-2); font-size: 16px; max-width: 60ch; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: step; }
.step { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; padding: 20px 20px; border-radius: var(--r-surface); background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); }
.step-n { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--ink-2); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
.app[data-dir="pattern"] .step { background: transparent; box-shadow: inset 0 0 0 1.5px var(--rule-2); }
.app[data-dir="pattern"] .step-n { border-radius: 3px; font-stretch: 75%; font-size: 22px; box-shadow: none; width: 44px; justify-content: start; }
.app[data-dir="night"] .step { background: transparent; box-shadow: none; border-top: 1px solid var(--rule); border-radius: 0; padding: 20px 0; }
.app[data-dir="night"] .step-n { box-shadow: none; font-weight: 300; font-stretch: 125%; font-size: 30px; width: 44px; justify-content: start; color: var(--ns-ink); }
.app[data-dir="script"] .step { box-shadow: var(--ls-float); }
.step h2 { font-size: 16.5px; font-weight: 650; margin-bottom: 4px; }
.app[data-dir="night"] .step h2 { font-weight: 500; font-stretch: 112%; }
.step p { color: var(--ink-2); font-size: 15px; }
.step .ext { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--ink); font-weight: 600; font-size: 14.5px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.app[data-dir="night"] .step .ext { font-weight: 500; text-decoration-color: var(--ns-signal); }
.step.now { box-shadow: inset 0 0 0 2px var(--ink); }
.app[data-dir="night"] .step.now { box-shadow: none; border-top: 2px solid var(--ns-signal); }
.app[data-dir="script"] .step.now { box-shadow: var(--ls-float), inset 0 0 0 1.5px var(--ink); }
.field-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.input {
  flex: 1 1 260px;
  min-width: 0;
  height: 42px;
  padding: 0 16px;
  border: 1px solid var(--rule-2);
  border-radius: var(--r-control);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--f-mono);
  font-size: 16px;
  outline: none;
}
.input::placeholder { color: var(--muted); opacity: 1; }
.input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.input[aria-invalid="true"] { border-color: var(--error); }
.field-row .btn { height: 42px; }
.key-msg { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: 14.5px; color: var(--ink-2); }
.key-msg[data-kind="error"] { color: var(--error); }
.key-msg[data-kind="ok"] { color: var(--ok); }
.key-msg svg { flex: 0 0 auto; margin-top: 4px; }
.fine { color: var(--muted); font-size: 13.5px; }

/* ---------- Settings and Brand ---------- */

.sect { display: flex; flex-direction: column; gap: 12px; padding: 24px 0; border-top: 1px solid var(--rule); }
.sect h2 { font-size: 16px; font-weight: 650; }
.app[data-dir="night"] .sect h2 { font-weight: 500; font-stretch: 112%; font-size: 17px; }
.sect .reply { font-size: 15.5px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.seg { align-self: flex-start; max-width: 100%; display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: var(--r-control); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--rule); }
.seg button { height: 32px; padding: 0 16px; border: 0; border-radius: var(--r-control); background: transparent; color: var(--ink-2); font-size: 14px; transition: background-color var(--t-press) ease, color var(--t-press) ease; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--rule-2); font-weight: 600; }
.app[data-dir="pattern"] .seg { background: transparent; box-shadow: none; gap: 8px; padding: 0; }
.app[data-dir="pattern"] .seg button { box-shadow: inset 0 0 0 1px var(--rule-2); border-radius: 3px; }
.app[data-dir="pattern"] .seg button[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--ink); background: transparent; }
.app[data-dir="night"] .seg { background: transparent; box-shadow: inset 0 0 0 1px var(--rule-2); padding: 0; gap: 0; }
.app[data-dir="night"] .seg button[aria-checked="true"] { background: var(--ns-ink); color: var(--ns-paper); box-shadow: none; font-weight: 500; }
.switch { display: flex; align-items: flex-start; gap: 12px; }
.switch input {
  appearance: none;
  flex: 0 0 auto;
  position: relative;
  width: 40px;
  height: 24px;
  margin: 0px 0 0;
  border-radius: 999px;
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--rule-2);
  transition: background-color var(--t-press) ease, box-shadow var(--t-press) ease;
}
.switch input::before { content: ""; position: absolute; top: 4px; left: 4px; width: 16px; height: 16px; border-radius: 999px; background: var(--ink-2); transition: transform 200ms var(--ease-out), background-color var(--t-press) ease; }
.switch input:checked { background: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.switch input:checked::before { transform: translateX(calc(16px)); background: var(--surface); }
.app[data-dir="night"] .switch input, .app[data-dir="night"] .switch input::before { border-radius: 0; }
.app[data-dir="night"] .switch input:checked { background: var(--ns-signal); box-shadow: none; }
.app[data-dir="night"] .switch input:checked::before { background: var(--ns-signal-ink); }
.switch strong { display: block; font-weight: 600; font-size: 15px; }
.switch span { display: block; color: var(--muted); font-size: 14px; }
.path { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); padding: 8px 12px; border-radius: var(--r-control); background: var(--surface-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-now { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand-now .row-meta { margin: 0; }
.sticky-ctx { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 12px; padding: 12px 0; background: var(--bg); border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--ink-2); }
.sticky-ctx strong { color: var(--ink); }
.never { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.never li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.never li strong { display: block; font-weight: 600; }
.never li span { display: block; color: var(--muted); font-size: 13.5px; }
.handles { display: flex; flex-wrap: wrap; gap: 8px; }
.handle { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: var(--r-chip); box-shadow: inset 0 0 0 1px var(--rule-2); font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); }
.app[data-dir="night"] .handle { font-family: var(--f-wide); }

/* Brand switch in a chat's header, and other menus */
.menu-anchor { position: relative; }
.menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  z-index: 30;
  width: 280px;
  padding: 8px;
  border: 1px solid var(--rule);
  border-radius: var(--r-surface);
  background: var(--surface);
  box-shadow: var(--float);
  transform-origin: 100% 0;
  transition: opacity var(--t-small) var(--ease-out), transform var(--t-small) var(--ease-out);
}
@starting-style {
  .menu { opacity: 0; transform: translateY(calc(-4px * var(--travel))) scale(calc(1 - 0.03 * var(--travel))); }
}
.menu button { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; width: 100%; padding: 8px 12px; border: 0; border-radius: calc(var(--r-surface) - 4px); background: transparent; text-align: left; }
.menu button strong { display: block; font-weight: 600; font-size: 14px; }
.menu button span { display: block; color: var(--muted); font-size: 12.5px; }
.menu button:focus-visible { outline-offset: -2px; }
@media (hover: hover) and (pointer: fine) {
  .menu button:hover { background: var(--surface-2); }
}

.toast {
  position: absolute;
  top: 14px;
  right: 16px;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--r-surface);
  background: var(--ink);
  color: var(--surface);
  font-size: 14px;
  box-shadow: var(--float);
  transition: opacity var(--t-arrive) var(--ease-out), transform var(--t-arrive) var(--ease-out);
}
@starting-style {
  .toast { opacity: 0; transform: translateY(calc(-8px * var(--travel))); }
}
.app[data-dir="night"] .toast { background: var(--ns-paper-3); color: var(--ns-ink); border-radius: 0; box-shadow: var(--ns-float); }

/* ---------- Motion: arrivals by direction ---------- */

/* New things arrive; things already on a screen when it opens stay put (the stage sets data-entering). */
.msg-u, .body > *, .clip, .note, .margin-note {
  transition-property: opacity, transform;
  transition-duration: var(--t-arrive);
  transition-timing-function: var(--ease-out);
}
@starting-style {
  .live .msg-u { opacity: 0; transform: translateY(calc(10px * var(--travel))); }
  .live .body > * { opacity: 0; transform: translateY(calc(8px * var(--travel))); }
  .live .clip { opacity: 0; transform: translateY(calc(8px * var(--travel))); }
  .live .note.new, .live .margin-note.new { opacity: 0; transform: translateX(calc(12px * var(--travel))); }
}

  /* ---------- Icons and the mark ---------- */

  const PATHS = {

  const mark = (w) => `<svg width="${w}" height="${Math.round((w * 52) / 64)}" viewBox="0 0 64 52" aria-hidden="true"><rect x="2" y="4" width="44" height="18" rx="9" style="fill: var(--ink)"/><rect class="mk-cut" x="18" y="30" width="42" height="16" rx="8" style="fill: none; stroke: var(--cut); stroke-width: 5; stroke-dasharray: 7 6"/></svg>`;

  /* ---------- Footage: generated frames, painted from the --ft tokens ---------- */

  const rgbCache = new Map();
  function rgb(token) {
    if (rgbCache.has(token)) return rgbCache.get(token);
    const value = getComputedStyle(document.documentElement).getPropertyValue(token).trim();
    const cv = document.createElement('canvas');
    cv.width = cv.height = 1;
    const c = cv.getContext('2d', { willReadFrequently: true });
    c.fillStyle = '#000';
    c.fillStyle = value;
    c.fillRect(0, 0, 1, 1);
    const d = c.getImageData(0, 0, 1, 1).data;
    const out = [d[0], d[1], d[2]];
    rgbCache.set(token, out);
    return out;
  }
  const tint = (token, a = 1) => { const [r, g, b] = rgb(token); return `rgb(${r} ${g} ${b} / ${a})`; };
  const SCENES = [
    { top: '--ft-warm', glow: '--ft-light', gx: 0.74, gy: 0.2, fx: 0.46, size: 1 },
    { top: '--ft-cool', glow: '--ft-light', gx: 0.2, gy: 0.28, fx: 0.6, size: 0.92 },
    { top: '--ft-warm', glow: '--ft-warm', gx: 0.5, gy: 0.1, fx: 0.52, size: 0.66 },
    { top: '--ft-cool', glow: '--ft-warm', gx: 0.5, gy: 0.04, fx: 0.5, size: 0.5 },
    { top: '--ft-light', glow: '--ft-warm', gx: 0.82, gy: 0.34, fx: 0.36, size: 0.95 }
  ];
  /* The still layers (sky, then floor and vignette) are drawn once per size; a frame adds only the light and the speaker. */
  const layerCache = new Map();
  function layers(n, w, h) {
    const key = `${n}|${w}|${h}`;
    if (layerCache.has(key)) return layerCache.get(key);
    const P = SCENES[n % SCENES.length];
    const make = () => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return [cv, cv.getContext('2d')]; };
    const [sky, sc] = make();
    const g = sc.createLinearGradient(0, 0, w * 0.35, h);
    g.addColorStop(0, tint(P.top, 0.95));
    g.addColorStop(0.58, tint('--ft-night', 0.94));
    g.addColorStop(1, tint('--ft-night'));
    sc.fillStyle = g;
    sc.fillRect(0, 0, w, h);
    const [over, oc] = make();
    const fy = h * 0.8;
    const floor = oc.createLinearGradient(0, fy, 0, h);
    floor.addColorStop(0, tint('--ft-night', 0.35));
    floor.addColorStop(1, tint('--ft-night', 0.95));
    oc.fillStyle = floor;
    oc.fillRect(0, fy, w, h - fy);
    const vig = oc.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
    vig.addColorStop(0, tint('--ft-night', 0));
    vig.addColorStop(1, tint('--ft-night', 0.5));
    oc.fillStyle = vig;
    oc.fillRect(0, 0, w, h);
    const out = { sky, over };
    layerCache.set(key, out);
    if (layerCache.size > 48) layerCache.delete(layerCache.keys().next().value);
    return out;

  function paint(cv, n, t = 0) {
    const box = cv.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.round(box.width * dpr);
    const h = Math.round(box.height * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const c = cv.getContext('2d');
    const P = SCENES[n % SCENES.length];
    const L = layers(n, w, h);
    c.drawImage(L.sky, 0, 0);
    const gx = w * (P.gx + 0.035 * Math.sin(t * 0.45));
    const gy = h * P.gy;
    const glow = c.createRadialGradient(gx, gy, 0, gx, gy, Math.max(w, h) * 0.6);
    glow.addColorStop(0, tint(P.glow, 0.78));
    glow.addColorStop(0.42, tint(P.glow, 0.2));
    glow.addColorStop(1, tint(P.glow, 0));
    c.fillStyle = glow;
    c.fillRect(0, 0, w, h);
    /* The speaker: head and shoulders */
    const u = (Math.min((w * 16) / 9, h) / 100) * P.size;
    const cx = w * P.fx + Math.sin(t * 0.9) * u * 0.8;
    const base = P.size < 0.8 ? h * 0.9 : h;
    const headR = 9 * u;
    const headY = base - 52 * u + Math.sin(t * 1.3) * u * 0.25;
    c.fillStyle = tint('--ft-night');
    c.beginPath();
    c.moveTo(cx - 25 * u, base + 2);
    c.bezierCurveTo(cx - 25 * u, base - 30 * u, cx - 14 * u, base - 38 * u, cx, base - 38 * u);
    c.bezierCurveTo(cx + 14 * u, base - 38 * u, cx + 25 * u, base - 30 * u, cx + 25 * u, base + 2);
    c.closePath();
    c.fill();
    c.fillRect(cx - 4 * u, headY + headR * 0.5, 8 * u, 12 * u);
    c.beginPath();
    c.arc(cx, headY, headR, 0, Math.PI * 2);
    c.fill();
    if (P.size < 0.8) c.fillRect(cx - 15 * u, base - 22 * u, 30 * u, h - base + 22 * u);
    c.drawImage(L.over, 0, 0);

  const paintAll = (root) => $$('canvas[data-scene]', root).forEach((cv) => paint(cv, +cv.dataset.scene, cv.hasAttribute('data-live') ? S.ed.t : 0));

<dl class="details" hidden>${kept.map((i) => `<dt>${esc(N.clip(i))}</dt><dd>${TITLES[i].map(esc).join('<br>')}</dd>`).join('')}</dl>`;
    },
    ask() {
      return '<p class="reply">Drop the footage here, or paste a link to it, and I’ll find the moments.</p>';
    },
    reply(m) {
      const cmd = /^\/([a-z]+)/.exec(m.text || '');
      const preset = cmd && PRESETS.find((p) => p[0] === cmd[1]);
      const what = preset ? `I used /${preset[0]} on the first clip. It ${preset[1].charAt(0).toLowerCase()}${preset[1].slice(1)}` : 'I made that change on the first clip and left the other two as they were.';
      return `<p class="reply">v${m.v} is ready. ${esc(what)}</p>
<div class="actions"><button class="btn btn-primary" type="button" data-act="open-clip" data-clip="0">Open in the editor</button></div>`;
    }
  };
  function msgHtml(m) {
    if (m.k === 'user') return userHtml(m);
    return `<div class="msg-a" data-k="${m.k}"><span class="who">${mark(24)}</span><div class="body">${BODIES[m.k](m)}</div></div>`;
  }
  const workingHtml = (stage, p) => `<div class="msg-a is-working" data-k="working"><span class="who">${mark(24)}</span><div class="body"><div class="working" role="status"><span class="work-stage">${esc(stage)}</span>${signalHtml(p)}<span class="work-time">0:00</span></div></div></div>`;

  function brandSwitchHtml() {
    return `<div class="menu-anchor"><button class="btn btn-secondary btn-small brand-btn" type="button" data-act="brand-menu" aria-haspopup="menu" aria-expanded="false" aria-label="Brand for this chat: ${esc(N.brand())}"><span class="brand-name">${esc(N.brand())}</span>${I('down', 16)}</button></div>`;
  }
  function threadView(o) {
    const msgs = o.live ? [{ k: 'user', file: o.live.file, text: o.live.text }] : STATIC_THREAD;
    return `<header class="hdr"><h1 class="hdr-title">${esc(N.thread())}</h1><span class="spacer"></span>${brandSwitchHtml()}</header>
<div class="scroll"><div class="thread-col" role="log" aria-label="Chat">${msgs.map(msgHtml).join('')}</div></div>
<div class="thread-foot">${composerHtml('thread', o)}</div>`;
  }
  function settleThread(app) {
    const col = $('.thread-col', app);
    if (!col) return;
    markLatest(col);
    const sc = $('.scroll', app);
    sc.scrollTop = sc.scrollHeight;
  }
  function markLatest(col) {
    const all = $$('.msg-a', col);
    all.forEach((m, i) => m.classList.toggle('latest', i === all.length - 1));
    /* One filled button per view: an older reply's primary steps down once a newer reply arrives. */
    all.slice(0, -1).forEach((m) => $$('.btn-primary', m).forEach((b) => b.classList.replace('btn-primary', 'btn-secondary')));
  }
  function push(app, html) {
    const col = $('.thread-col', app);
    const holder = document.createElement('div');
    holder.innerHTML = html.trim();
    const el = holder.firstElementChild;
    col.append(el);
    if (el.classList.contains('is-working')) el.dataset.start = String(performance.now());
    paintAll(el);
    markLatest(col);
    scrollDown(app);
    return el;
  }
  function swap(app, oldEl, html) {
    const holder = document.createElement('div');
    holder.innerHTML = html.trim();
    const el = holder.firstElementChild;
    oldEl.replaceWith(el);
    paintAll(el);
    markLatest($('.thread-col', app));
    scrollDown(app);
    return el;
  }
  function scrollDown(app) {
    const sc = $('.scroll', app);
    if (!sc) return;
    requestAnimationFrame(() => sc.scrollTo({ top: sc.scrollHeight, behavior: reduced() ? 'auto' : 'smooth' }));
  }
  function setBusy(app, where, busy) {
    S[where].busy = busy;
    const comp = $(`.composer[data-where="${where}"]`, app);
    if (comp) syncComposer(comp);
  }

  /* The conversation, played: Replay runs all of it; a send from Start runs the first reply. */
  function playThread(app, from) {
    const file = from ? from.file : true;
    const steps = [];
    let w;
    steps.push([380, () => { w = push(app, workingHtml(file ? `Listening to ${N.file()}` : 'Thinking', null)); }]);
    if (file) {
      steps.push([1500, () => setStage(w, 'Finding clips', null)]);
      steps.push([1300, () => { swap(app, w, msgHtml({ k: 'clipset' })); if (from) setBusy(app, 'thread', false); }]);
    } else {
      steps.push([1400, () => { swap(app, w, msgHtml({ k: 'ask' })); setBusy(app, 'thread', false); }]);
    }
    if (!from) {
      steps.push([1700, () => push(app, userHtml({ text: 'Open the first one on the kitchen line, and lose the pause before it' }))]);
      steps.push([420, () => { w = push(app, workingHtml('Making v2', 0.08)); }]);
      steps.push([420, () => setStage(w, null, 0.45)]);
      steps.push([420, () => setStage(w, null, 0.85)]);
      steps.push([380, () => swap(app, w, msgHtml({ k: 'proof' }))]);
      steps.push([1500, () => push(app, msgHtml({ k: 'video' }))]);
      steps.push([260, () => { push(app, msgHtml({ k: 'kit' })); setBusy(app, 'thread', false); }]);
    }
    let at = 0;
    for (const [d, fn] of steps) { at += d; later(fn, at); }
  }

  function exportAll(app, btn) {
    const kept = keptClips();
    if (!kept.length) return;
    $$('[data-act="export-all"]', app).forEach((b) => { b.disabled = true; });
    setBusy(app, 'thread', true);
    const n = kept.length;
    const w = push(app, workingHtml(`Making the clips (1 of ${n})`, 0.04));
    let k = 0;
    const step = () => {
      setStage(w, null, (k + 0.6) / (n + 0.4));
      later(() => {
        k += 1;
        if (k < n) { setStage(w, `Making the clips (${k + 1} of ${n})`, k / (n + 0.4)); later(step, 380); }
        else {
          setStage(w, 'Writing the description', null);
          later(() => {
            S.exportedAll = true;
            swap(app, w, msgHtml({ k: 'set' }));
            $$('[data-act="export-all"]', app).forEach((b) => { b.disabled = false; b.textContent = exportAllLabel(); });
            setBusy(app, 'thread', false);
          }, 1100);
        }
      }, 520);
    };
    later(step, 380);
  }

  function threadSend(app) {
    const st = S.thread;
    const text = st.text.trim();
    if (!text && !st.file) return;
    push(app, userHtml({ text, file: st.file }));
    S.thread = { text: '', file: false, busy: true };
    syncComposer($('.composer[data-where="thread"]', app));
    const w = push(app, workingHtml('Thinking', null));
    later(() => {
      const v = nextV();
      S.ed.versions.push(v);
      S.ed.v = v;
      swap(app, w, msgHtml({ k: 'reply', text, v }));
      setBusy(app, 'thread', false);
    }, 1900);
  }

  /* ---------- Editor ---------- */

  function versionsHtml() {
    const E = S.ed;
    return `<div class="versions" role="group" aria-label="Versions">${E.versions.map((v) => `<button class="ver${v === E.fresh ? ' new' : ''}" type="button" data-act="ver" data-v="${v}" aria-pressed="${v === E.v}" style="--rev: ${REV[Math.min(v, 6)]}"${S.dir === 'script' ? ` aria-label="v${v}, ${REV_NAME[Math.min(v, 6)]} pages"` : ''}>v${v}</button>`).join('')}</div>`;
  }
  const whereText = (at) => (Array.isArray(at) ? `${clock(at[0])} to ${clock(at[1])}` : `At ${clock(at)}`);
  function beatIndexAt(t, v = S.ed.v) {
    const V = beatsOf(v);
    let acc = 0;
    for (let i = 0; i < V.length; i++) { acc += V[i].d; if (t < acc) return i; }
    return V.length - 1;
  }
  const lineOf = (at) => beatIndexAt(Array.isArray(at) ? at[0] : at);
  function notesListHtml() {
    const E = S.ed;
    if (!E.notes.length) return '<p class="fine">Pick a stretch on the strip, then say what to change.</p>';
    return `<ol class="notes">${E.notes.map((nt, i) => `<li class="note${nt.fresh ? ' new' : ''}"><span class="note-n">${i + 1}</span><div><p class="note-text">${esc(nt.text)}</p><span class="note-where">${whereText(nt.at)}</span></div><button class="note-x" type="button" data-act="rm-note" data-i="${i}" aria-label="Remove note ${i + 1}">${I('x', 16)}</button></li>`).join('')}</ol>`;
  }
  function scriptPageHtml() {
    const E = S.ed;
    const V = beatsOf(E.v);
    const on = beatIndexAt(E.t);
    let acc = 0;
    const lines = V.map((b, i) => {
      const s0 = acc;
      acc += b.d;
      const picked = E.pick && s0 < E.pick[1] && acc > E.pick[0];
      const notes = E.notes.map((nt, k) => [nt, k]).filter(([nt]) => lineOf(nt.at) === i);
      return `<div class="sline${picked ? ' picked' : ''}${i === on ? ' on' : ''}" data-i="${i}"><span class="bn">${i + 1}</span><span class="words">${esc(b.line)}</span></div>${notes.map(([nt, k]) => `<p class="margin-note${nt.fresh ? ' new' : ''}"><b>${k + 1}</b><span>${esc(nt.text)}</span><button class="note-x" type="button" data-act="rm-note" data-i="${k}" aria-label="Remove note ${k + 1}">${I('x', 14)}</button></p>`).join('')}`;
    }).join('');
    const gone = E.v >= 2 ? `<div class="sline cut"><span class="bn"></span><span class="words struck">${esc(PAUSE)}</span></div>` : '';
    return `<div class="script-page">${gone}${lines}</div>`;
  }
  function sideHtml() {
    const E = S.ed;
    const n = E.notes.length;
    const status = E.applying
      ? `<div class="status is-working"><span class="who">${mark(22)}</span><div class="working" role="status"><span class="work-stage">Making v${nextV()}</span>${signalHtml(null)}<span class="work-time">0:00</span></div></div>`
      : `<p class="reply status-line">${esc(summaryOf(E.v))}</p>`;
    return `<div class="side-scroll">${status}<h2 class="side-h">${S.dir === 'script' ? `The script, v${E.v}` : `Notes for v${nextV()}`}</h2>${S.dir === 'script' ? scriptPageHtml() : notesListHtml()}</div>
<div class="side-foot">
  <div class="picked-line"${E.pick ? '' : ' hidden'}><span>Picked</span><span class="tc">${E.pick ? `${clock(E.pick[0])} to ${clock(E.pick[1])}` : ''}</span><span class="spacer"></span><button class="link" type="button" data-act="clear-pick">Clear</button></div>
  <p class="hint-line"${E.pick ? ' hidden' : ''}>Shift and drag on the strip to pick a stretch.</p>
  <form class="note-input" data-form="note"><input class="input text" type="text" aria-label="Note" placeholder="Add a note, or type /" autocomplete="off"><button class="send" type="submit" aria-label="Add the note">${I('up', 18)}</button></form>
  ${n ? `<button class="btn btn-primary" type="button" data-act="apply"${E.applying ? ' disabled' : ''}>Apply ${n} note${n === 1 ? '' : 's'} as v${nextV()}</button>` : ''}
</div>`;
  }
  function stripHtml() {
    const E = S.ed;
    const V = beatsOf(E.v);
    const T = total(E.v);
    return `<div class="strip">
  <button class="play" type="button" data-act="play" aria-label="${E.playing ? 'Pause' : 'Play'}">${I(E.playing ? 'pause' : 'play')}</button>
  <span class="tc-now"><span class="tc-t">${tenths(E.t)}</span> <span class="tc-of">/ ${clock(T)}</span></span>
  <div class="beats" role="slider" tabindex="0" aria-label="Playhead" aria-valuemin="0" aria-valuemax="${T}" aria-valuenow="${Math.round(E.t)}" aria-valuetext="${clock(E.t)} of ${clock(T)}">
    ${V.map((b, i) => `<span class="beat" data-n="${i + 1}" style="--w:${b.d}${S.dir === 'script' ? `; --rev: ${REV[Math.min(E.v, 6)]}` : ''}">${esc(b.line)}</span>`).join('')}
    <span class="pick-bar" hidden></span><span class="playhead"></span>
  </div>
</div>`;
  }
  function editorHeader() {
    const E = S.ed;
    const quiet = E.notes.length > 0 || E.applying;
    return `<header class="hdr">
  <button class="btn btn-icon" type="button" data-act="back" aria-label="Back to the chat">${I('back')}</button>
  <h1 class="hdr-title">${esc(N.clip(0))}</h1>
  ${versionsHtml()}
  <span class="spacer"></span>
  <button class="btn btn-text wide" type="button" data-act="undo">Undo</button>
  <button class="btn ${quiet ? 'btn-secondary' : 'btn-primary'}" type="button" data-act="export">Export</button>
</header>`;
  }
  function editorView(o) {
    return `${editorHeader()}
<div class="ed${S.ed.applying ? ' is-applying' : ''}">
  <div class="well"><div class="frame"${o.phone ? '' : ' style="view-transition-name: cl-footage"'}><canvas data-scene="0" data-live role="img" aria-label="Preview of ${esc(N.clip(0))}"></canvas><p class="caption" aria-hidden="true"></p></div></div>
  <aside class="side" aria-label="Notes">${sideHtml()}</aside>
  ${stripHtml()}
</div>`;
  }
  function refreshEditor(app, parts) {
    const holder = document.createElement('div');
    holder.innerHTML = editorView({});
    const main = $('.main', app);
    if (parts.includes('hdr')) $('.hdr', main).replaceWith($('.hdr', holder));
    if (parts.includes('side')) $('.side', main).innerHTML = $('.side', holder).innerHTML;
    if (parts.includes('strip')) $('.strip', main).replaceWith($('.strip', holder));
    $('.ed', main).classList.toggle('is-applying', S.ed.applying);
    S.ed.notes.forEach((nt) => { nt.fresh = false; });
    S.ed.fresh = null;
    layoutStrip(app);
  }
  const geo = new WeakMap();
  function geometry(beats) {
    let g = geo.get(beats);
    if (!g || g.width !== beats.clientWidth) {
      g = { width: beats.clientWidth, boxes: $$('.beat', beats).map((el) => [el.offsetLeft, el.offsetWidth]) };
      geo.set(beats, g);
    }
    return g.boxes;
  }
  function xAt(beats, t) {
    const boxes = geometry(beats);
    const V = beatsOf(S.ed.v);
    let acc = 0;
    for (let i = 0; i < V.length; i++) {
      if (t <= acc + V[i].d || i === V.length - 1) {
        const f = Math.min(1, Math.max(0, (t - acc) / V[i].d));
        return boxes[i][0] + f * boxes[i][1];
      }
      acc += V[i].d;
    }
    return 0;
  }
  function timeAtX(beats, clientX) {
    const x = clientX - beats.getBoundingClientRect().left;
    const els = $$('.beat', beats);
    const V = beatsOf(S.ed.v);
    let acc = 0;
    for (let i = 0; i < els.length; i++) {
      const L = els[i].offsetLeft;
      const W = els[i].offsetWidth;
      if (x < L + W + 1.5 || i === els.length - 1) return Math.min(total(S.ed.v), acc + Math.min(1, Math.max(0, (x - L) / W)) * V[i].d);
      acc += V[i].d;
    }
    return 0;
  }
  function layoutStrip(app) {
    const beats = $('.beats', app);
    if (!beats) return;
    const E = S.ed;
    const V = beatsOf(E.v);
    const T = total(E.v);
    $('.playhead', beats).style.transform = `translateX(${xAt(beats, E.t).toFixed(1)}px)`;
    const bar = $('.pick-bar', beats);
    if (E.pick) {
      const a = xAt(beats, E.pick[0]);
      const b = xAt(beats, E.pick[1]);
      bar.hidden = false;
      bar.style.left = `${a.toFixed(1)}px`;
      bar.style.width = `${Math.max(2, b - a).toFixed(1)}px`;
    } else bar.hidden = true;
    const on = beatIndexAt(E.t);
    let acc = 0;
    $$('.beat', beats).forEach((el, i) => {
      const s0 = acc;
      acc += V[i].d;
      el.classList.toggle('on', i === on);
      el.classList.toggle('picked', !!E.pick && s0 < E.pick[1] && acc > E.pick[0]);
    });
    $$('.sline[data-i]', app).forEach((el) => el.classList.toggle('on', +el.dataset.i === on));
    const tc = $('.tc-t', app);
    const shown = tenths(E.t);
    if (tc && tc.textContent !== shown) tc.textContent = shown;
    const sec = String(Math.round(E.t));
    if (beats.getAttribute('aria-valuenow') !== sec) {
      beats.setAttribute('aria-valuenow', sec);
      beats.setAttribute('aria-valuetext', `${clock(E.t)} of ${clock(T)}`);
    }
    const words = V[on].line.split(' ');
    const pairs = Math.ceil(words.length / 2);
    let s0 = 0;
    for (let i = 0; i < on; i++) s0 += V[i].d;
    const k = Math.min(pairs - 1, Math.floor(((E.t - s0) / V[on].d) * pairs));
    const cap = $('.caption', app);
    const line = words.slice(k * 2, k * 2 + 2).join(' ');
    if (cap && cap.textContent !== line) cap.textContent = line;
  }
  const paintFrame = (app) => { const cv = $('.frame canvas', app); if (cv) paint(cv, 0, S.ed.t); };

  let raf = 0;
  function play(app) {
    const E = S.ed;
    if (E.playing) return;
    E.playing = true;
    let last = performance.now();
    let odd = false;
    const tick = (now) => {
      E.t += Math.min(0.1, (now - last) / 1000);
      last = now;
      if (E.t >= total(E.v)) E.t = 0;
      layoutStrip(app);
      odd = !odd;
      if (odd) paintFrame(app);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    syncPlay(app);
  }
  function pause(app) {
    cancelAnimationFrame(raf);
    S.ed.playing = false;
    if (app) syncPlay(app);
  }
  function syncPlay(app) {
    const b = $('.play', app);
    if (!b) return;
    b.innerHTML = I(S.ed.playing ? 'pause' : 'play');
    b.setAttribute('aria-label', S.ed.playing ? 'Pause' : 'Play');
  }
  function applyNotes(app) {
    const E = S.ed;
    if (E.applying || !E.notes.length) return;
    const v = nextV();
    const defaults = E.notes.length === 2 && E.notes[0].text === DEFAULT_NOTES()[0].text;
    E.applying = true;
    pause(app);
    refreshEditor(app, ['hdr', 'side']);
    const w = $('.status.is-working', app);
    if (w) w.dataset.start = String(performance.now());
    later(() => {
      E.applying = false;
      if (!defaults) E.summary[v] = `v${v} is ready. I made the ${E.notes.length === 1 ? 'change in your note' : `${E.notes.length} changes in your notes`}.`;
      E.versions.push(v);
      E.fresh = v;
      E.v = v;
      E.notes = [];
      E.pick = null;
      E.t = Math.min(E.t, total(v) - 0.1);
      refreshEditor(app, ['hdr', 'side', 'strip']);
      flashFrame(app);
      announce(summaryOf(v));
    }, 2400);
  }
  function setVersion(app, v) {
    if (v === S.ed.v) return;
    S.ed.v = v;
    S.ed.t = Math.min(S.ed.t, total(v) - 0.1);
    refreshEditor(app, ['hdr', 'side', 'strip']);
    flashFrame(app);
  }
  function flashFrame(app) {
    const f = $('.frame', app);
    if (!f) return;
    f.classList.remove('ver-flash');
    void f.offsetWidth;
    f.classList.add('ver-flash');
    paintFrame(app);
  }

  /* ---------- Key setup ---------- */

  function detectProvider(k) {
    if (k.startsWith('sk-ant-')) return 'anthropic';
    if (k.startsWith('sk-')) return 'openai';
    if (k.startsWith('AIza')) return 'google';
    return null;
  }
  function checkKey(raw) {
    const k = raw.trim();
    const from = detectProvider(k);
    if (from === 'openai') return ['error', 'That looks like an OpenAI key. Cutalong needs one from Anthropic, which starts sk-ant-.'];
    if (from === 'google') return ['error', 'That looks like a Google key. Cutalong needs one from Anthropic, which starts sk-ant-.'];
    if (!from) return ['error', 'That doesn’t look like a key from Anthropic. Theirs start sk-ant-.'];
    if (k.length < 40) return ['error', 'That key looks cut short. Copy it again from the console.'];
    return ['ok', ''];
  }
  function keyStepHtml() {
    const k = S.key;
    if (k.state === 'saved') {
      return `<div class="key-saved"><p class="key-msg" data-kind="ok">${I('check', 18)}<span>Saved. It ends in ${esc(k.value.slice(-4))}, and it stays on this Mac.</span></p><div class="actions"><button class="btn btn-primary" type="button" data-go="start">Start editing</button><button class="btn btn-text" type="button" data-act="replace-key">Use a different key</button></div></div>`;
    }
    const bad = k.kind === 'error';
    return `<div class="field-row"><input class="input" id="key-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Anthropic API key" placeholder="Starts with sk-ant-" value="${esc(k.value)}"${bad ? ' aria-invalid="true" aria-describedby="key-msg"' : ''}><button class="btn btn-primary" type="button" data-act="save-key"${k.value.trim() ? '' : ' disabled'}>Save key</button></div>
<p class="key-msg" id="key-msg" data-kind="${bad ? 'error' : ''}"${bad ? ' role="alert"' : ' hidden'}>${bad ? `${I('alert', 18)}<span>${esc(k.msg)}</span>` : ''}</p>`;
  }
  function keyView() {
    return `<div class="scroll"><div class="page">
  <h1 class="page-title">Connect your Anthropic account</h1>
  <p class="lede">Cutalong thinks with your own Anthropic key. You do this once, and the key stays on this Mac.</p>
  <ol class="steps">
    <li class="step"><span class="step-n">1</span><div><h2>Open the Anthropic Console</h2><p>Sign in, or make an account with your email.</p><a class="ext" href="https://console.anthropic.com/" target="_blank" rel="noopener noreferrer">console.anthropic.com${I('ext', 16)}</a></div></li>
    <li class="step"><span class="step-n">2</span><div><h2>Add some credit</h2><p>Under Billing, add a card and buy a little credit. Cutalong spends it only while it works for you.</p></div></li>
    <li class="step"><span class="step-n">3</span><div><h2>Make a key</h2><p>Open API keys, choose Create key, and call it Cutalong. Copy it straight away: the console shows it once.</p></div></li>
    <li class="step${S.key.state === 'saved' ? '' : ' now'}"><span class="step-n">4</span><div><h2>Paste it here</h2><div class="key-slot">${keyStepHtml()}</div></div></li>
  </ol>
  <p class="fine">Without a key, Cutalong still cuts on this Mac. With one, it finds your clips and writes your titles. <button class="link" type="button" data-go="start">Not now</button></p>
</div></div>`;
  }
  function saveKey(app) {
    const input = $('#key-input', app);
    if (!input) return;
    const value = input.value;
    const [kind, msg] = checkKey(value);
    if (kind === 'ok') {
      S.key = { value: value.trim(), state: 'saved', kind: '', msg: '' };
      $('.key-slot', app).innerHTML = keyStepHtml();
      $('.step.now', app)?.classList.remove('now');
      announce('Saved.');
      $('.key-slot .btn-primary', app)?.focus();
      return;
    }
    /* The field keeps what was pasted, so the mistake can be seen and fixed. */
    S.key = { value, state: 'empty', kind, msg };
    $('.key-slot', app).innerHTML = keyStepHtml();
    const again = $('#key-input', app);
    again.focus();
    again.setSelectionRange(again.value.length, again.value.length);
  }
