name: Mobile engine

# Builds the phone engines (ffmpeg 6.0, ffprobe and whisper.cpp in-process,
# mobile/engine) for Android and iOS, and runs their self-test on an Android
# emulator and an iPhone simulator. Nothing here is signed or published.
on:
  push:
    branches:
      - claude/mobile
  workflow_dispatch:

concurrency:
  group: mobile-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MESON_VERSION: 1.12.1
  NODE_VERSION: 22

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7

      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm ninja-build autoconf automake libtool pkg-config >/dev/null
          pipx install "meson==$MESON_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Built libraries are cached apart from the engine library, which is
      # rebuilt every time, and saved as soon as they are built: a failing
      # test later must not throw an hour of building away.
      - name: Restore ffmpeg and its libraries
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            mobile/engine/.build/android-arm64-v8a/prefix
            mobile/engine/.build/android-x86_64/prefix
          key: android-ffmpeg-${{ env.NDK_VERSION }}-${{ hashFiles('mobile/engine/scripts/versions.env', 'mobile/engine/scripts/lib/env.sh', 'mobile/engine/scripts/lib/ffmpeg.sh', 'mobile/engine/patches/**') }}

      - name: Restore whisper.cpp
        id: whisper-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            mobile/engine/.build/android-arm64-v8a/whisper
            mobile/engine/.build/android-x86_64/whisper
          key: android-whisper-${{ env.NDK_VERSION }}-${{ hashFiles('mobile/engine/scripts/versions.env', 'mobile/engine/scripts/lib/env.sh', 'mobile/engine/scripts/lib/whisper.sh') }}

      - name: Build ffmpeg, its libraries and whisper.cpp
        run: mobile/engine/scripts/build.sh android-libs

      - name: Save ffmpeg and its libraries
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            mobile/engine/.build/android-arm64-v8a/prefix
            mobile/engine/.build/android-x86_64/prefix
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Save whisper.cpp
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            mobile/engine/.build/android-arm64-v8a/whisper
            mobile/engine/.build/android-x86_64/whisper
          key: ${{ steps.whisper-cache.outputs.cache-primary-key }}

      - name: Build the engine library
        run: mobile/engine/scripts/build.sh android

      - name: What was built
        run: |
          for abi in arm64-v8a x86_64; do
            dir=mobile/engine/android/src/main/jniLibs/$abi
            echo "== $abi"
            ls -l "$dir"
            grep -E "^License:" mobile/engine/.build/android-$abi/prefix/ffmpeg-private/configure.log
            grep -A4 "^External libraries:" mobile/engine/.build/android-$abi/prefix/ffmpeg-private/configure.log
            echo "engine library needs:"
            readelf -d "$dir/libcutalong_engine.so" | grep NEEDED
            # Every library must load on 16 KB page devices.
            for so in "$dir"/*.so; do
              align=$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF; exit }')
              echo "$(basename "$so"): LOAD alignment $align"
              [ "$align" = "0x4000" ] || [ "$align" = "0x10000" ] || { echo "::error::$so is not 16 KB aligned"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: android-engine
          path: mobile/engine/android/src/main/jniLibs
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Build tools
        run: |
          brew install nasm ninja autoconf automake libtool pkg-config >/dev/null || true
          pipx install "meson==$MESON_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Homebrew's libtoolize is glibtoolize; zimg's autogen.sh asks for it.
          echo "LIBTOOLIZE=glibtoolize" >> "$GITHUB_ENV"
          echo "XCODE_ID=$(xcodebuild -version | tr -s ' \n' '-')" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Restore ffmpeg and its libraries
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            mobile/engine/.build/ios-arm64/prefix
            mobile/engine/.build/ios-sim-arm64/prefix
          key: ios-ffmpeg-${{ env.XCODE_ID }}-${{ hashFiles('mobile/engine/scripts/versions.env', 'mobile/engine/scripts/lib/env.sh', 'mobile/engine/scripts/lib/ffmpeg.sh', 'mobile/engine/patches/**') }}

      - name: Restore whisper.cpp
        id: whisper-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            mobile/engine/.build/ios-arm64/whisper
            mobile/engine/.build/ios-sim-arm64/whisper
          key: ios-whisper-${{ env.XCODE_ID }}-${{ hashFiles('mobile/engine/scripts/versions.env', 'mobile/engine/scripts/lib/env.sh', 'mobile/engine/scripts/lib/whisper.sh') }}

      - name: Build ffmpeg, its libraries and whisper.cpp
        run: mobile/engine/scripts/build.sh ios-libs

      - name: Save ffmpeg and its libraries
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            mobile/engine/.build/ios-arm64/prefix
            mobile/engine/.build/ios-sim-arm64/prefix
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Save whisper.cpp
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            mobile/engine/.build/ios-arm64/whisper
            mobile/engine/.build/ios-sim-arm64/whisper
          key: ${{ steps.whisper-cache.outputs.cache-primary-key }}

      - name: Build the engine library
        run: mobile/engine/scripts/build.sh ios

      - name: What was built
        run: |
          ls mobile/engine/ios/Frameworks
          grep -E "^License:" mobile/engine/.build/ios-arm64/prefix/ffmpeg-private/configure.log
          grep -A4 "^External libraries:" mobile/engine/.build/ios-arm64/prefix/ffmpeg-private/configure.log
          for fw in mobile/engine/ios/Frameworks/*.xcframework; do
            name=$(basename "$fw" .xcframework)
            for slice in "$fw"/*/; do
              bin="$slice$name.framework/$name"
              echo "$(basename "$slice") $name: $(lipo -archs "$bin"), $(du -h "$bin" | cut -f1)"
            done
          done
          echo "engine library needs:"
          otool -L mobile/engine/ios/Frameworks/CutalongEngineCore.xcframework/ios-arm64/CutalongEngineCore.framework/CutalongEngineCore
          # What ios/Sources/CutalongEnginePlugin/PrivacyInfo.xcprivacy must declare.
          echo "required-reason APIs each framework calls:"
          for fw in mobile/engine/ios/Frameworks/*.xcframework; do
            name=$(basename "$fw" .xcframework)
            calls=$(nm -u "$fw/ios-arm64/$name.framework/$name" | grep -oE '^_(stat|fstat|lstat|fstatat|getattrlist|fgetattrlist|getattrlistat|getattrlistbulk|statfs|fstatfs|statvfs|fstatvfs|mach_absolute_time)(\$INODE64)?$' | sort -u | tr '\n' ' ')
            echo "  $name: ${calls:-none}"
          done

      - name: Pack the frameworks
        run: tar -C mobile/engine/ios -czf ios-frameworks.tar.gz Frameworks

      - uses: actions/upload-artifact@v7
        with:
          name: ios-engine
          path: ios-frameworks.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The self-test's sample media, made with the runner's ffmpeg (libx264,
  # libx265, libwebp, an AV1 encoder, zscale), and what each test render
  # should come out as, from running it here first. Nothing is committed.
  media:
    name: Sample media
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -hide_banner -version | head -1

      - name: Make the sample media and what each render should come out as
        run: python3 mobile/engine/example/tools/make_media.py "$RUNNER_TEMP/media" .

      - uses: actions/upload-artifact@v7
        with:
          name: selftest-media
          path: ${{ runner.temp }}/media
          if-no-files-found: error
          retention-days: 14

  android-test:
    name: Android self-test
    needs: [android, media]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      IMAGE: system-images;android-34;google_apis;x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/engine/example/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: android-engine
          path: mobile/engine/android/src/main/jniLibs

      - uses: actions/download-artifact@v8
        with:
          name: selftest-media
          path: ${{ runner.temp }}/media

      # The two models the app offers, base.en and small.en, downloaded and
      # checked by ci/fetch-models.sh, and kept between runs.
      - name: Restore the whisper models
        id: models
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/models
          key: whisper-models-${{ runner.os }}-${{ hashFiles('mobile/engine/example/ci/fetch-models.sh') }}

      - name: The whisper models
        run: mobile/engine/example/ci/fetch-models.sh "$RUNNER_TEMP/models"

      - name: Save the whisper models
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/models
          key: ${{ steps.models.outputs.cache-primary-key }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/engine/example/package-lock.json', 'mobile/engine/android/build.gradle') }}

      - name: Build the test app
        working-directory: mobile/engine/example
        run: |
          npm ci
          node build.mjs "$RUNNER_TEMP/media"
          node native.mjs android
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug
          ls -l app/build/outputs/apk/debug/

      - name: Start the emulator
        run: |
          # The emulator needs KVM, which the runner has but does not open to it.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$sdk/sdkmanager" --install emulator platform-tools "$IMAGE" >/dev/null
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo no | "$sdk/avdmanager" create avd --force -n selftest -k "$IMAGE" -d pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd selftest -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none -memory 4096 -cores 4 -partition-size 8192 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for _ in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != 1 ]; then
            tail -n 50 "$RUNNER_TEMP/emulator.log"
            echo "::error::the emulator did not boot"
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put system screen_off_timeout 2147483647
          adb shell svc power stayon true
          adb shell input keyevent 82
          echo "booted: $(adb shell getprop ro.build.fingerprint)"
          echo "WebView: $(adb shell dumpsys webviewupdate | grep -m1 'Current WebView package')"
          echo "CPU: $(adb shell grep -m1 -E '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -xE 'sse4_2|avx|avx2|fma|f16c' | tr '\n' ' ')"

      - name: Run the self-test on the emulator
        run: |
          status=0
          SELFTEST_TIMEOUT=3600 mobile/engine/example/ci/android-selftest.sh \
            mobile/engine/example/android/app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/models" "$RUNNER_TEMP/selftest" || status=$?
          if [ -f "$RUNNER_TEMP/selftest/selftest.json" ]; then
            python3 mobile/engine/example/tools/check_report.py "$RUNNER_TEMP/selftest/selftest.json" || status=1
          fi
          exit $status

      - if: always()
        run: cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/selftest/" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-selftest
          path: ${{ runner.temp }}/selftest
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-example-apk
          path: mobile/engine/example/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios-test:
    name: iOS self-test
    needs: [ios, media]
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/engine/example/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: ios-engine
          path: ${{ runner.temp }}/engine

      - name: Unpack the frameworks
        run: tar -C mobile/engine/ios -xzf "$RUNNER_TEMP/engine/ios-frameworks.tar.gz"

      - uses: actions/download-artifact@v8
        with:
          name: selftest-media
          path: ${{ runner.temp }}/media

      # The two models the app offers, base.en and small.en, downloaded and
      # checked by ci/fetch-models.sh, and kept between runs.
      - name: Restore the whisper models
        id: models
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/models
          key: whisper-models-${{ runner.os }}-${{ hashFiles('mobile/engine/example/ci/fetch-models.sh') }}

      - name: The whisper models
        run: mobile/engine/example/ci/fetch-models.sh "$RUNNER_TEMP/models"

      - name: Save the whisper models
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/models
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Pick an iPhone simulator and boot it
        id: sim
        run: |
          python3 mobile/engine/example/ci/pick-simulator.py > "$RUNNER_TEMP/sim.txt"
          echo "udid=$(sed -n 1p "$RUNNER_TEMP/sim.txt")" >> "$GITHUB_OUTPUT"
          echo "simulator: $(sed -n 2p "$RUNNER_TEMP/sim.txt")"
          xcrun simctl boot "$(sed -n 1p "$RUNNER_TEMP/sim.txt")" || true

      - name: Build the test app for the simulator
        working-directory: mobile/engine/example
        run: |
          npm ci
          node build.mjs "$RUNNER_TEMP/media"
          node native.mjs ios
          # Signed ad hoc, as Xcode signs for the simulator: no team, no profile.
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= -quiet build
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          ls "$app/Frameworks"
          du -sh "$app"

      - name: Run the self-test on the simulator
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          status=0
          SELFTEST_TIMEOUT=3600 mobile/engine/example/ci/ios-selftest.sh \
            "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app" \
            "$RUNNER_TEMP/models" "$RUNNER_TEMP/selftest" "${{ steps.sim.outputs.udid }}" || status=$?
          if [ -f "$RUNNER_TEMP/selftest/selftest.json" ]; then
            python3 mobile/engine/example/tools/check_report.py "$RUNNER_TEMP/selftest/selftest.json" || status=1
          fi
          exit $status

      - name: Pack the simulator app
        if: always()
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          if [ -d "$app" ]; then ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Engine-Test-simulator.zip"; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-selftest
          path: ${{ runner.temp }}/selftest
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-example-app
          path: ${{ runner.temp }}/Engine-Test-simulator.zip
          retention-days: 14

  # What each phone made, measured here with the same ffmpeg that made the
  # expectations: length, sound, picture size and colours at known moments.
  exports:
    name: Exports measured on the runner
    needs: [media, android-test, ios-test]
    if: ${{ !cancelled() && needs.media.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null

      - uses: actions/download-artifact@v8
        with:
          name: selftest-media
          path: ${{ runner.temp }}/media

      - uses: actions/download-artifact@v8
        id: android
        continue-on-error: true
        with:
          name: android-selftest
          path: ${{ runner.temp }}/android

      - uses: actions/download-artifact@v8
        id: ios
        continue-on-error: true
        with:
          name: ios-selftest
          path: ${{ runner.temp }}/ios

      - name: Android's exports
        if: ${{ !cancelled() }}
        run: |
          [ "${{ steps.android.outcome }}" = success ] || { echo "::error::nothing came back from the Android self-test"; exit 1; }
          python3 mobile/engine/example/tools/check_exports.py "$RUNNER_TEMP/android/selftest-out" "$RUNNER_TEMP/media" "$RUNNER_TEMP/android/selftest.json"

      - name: iOS's exports
        if: ${{ !cancelled() }}
        run: |
          [ "${{ steps.ios.outcome }}" = success ] || { echo "::error::nothing came back from the iOS self-test"; exit 1; }
          python3 mobile/engine/example/tools/check_exports.py "$RUNNER_TEMP/ios/selftest-out" "$RUNNER_TEMP/media" "$RUNNER_TEMP/ios/selftest.json"
