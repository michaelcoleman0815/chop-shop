name: Test build

# A .dmg of the Cutalong work in progress, built on every push to its branch so
# the owner can try it. It is uploaded as a workflow artifact and never
# published as a release: every installed copy of Chop Shop updates itself from
# GitHub Releases, so a release from here would hand unfinished work to
# everyone who has the app.
on:
  push:
    branches:
      - claude/mcp-x1yvms
  workflow_dispatch:

# A newer push makes the build in progress pointless.
concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    # macos-14 jobs were cancelled before a runner was assigned (twice, with
    # no log), so this uses GitHub's current Apple Silicon image.
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The same helpers the release builds, for the same reason: resources/bin
      # is gitignored, and anything not built here is missing from the app.
      - name: Build whisper.cpp
        run: ./scripts/build-whisper.sh

      - name: Build the Vision helper
        run: ./scripts/build-native.sh

      - name: Fetch yt-dlp
        run: ./scripts/fetch-ytdlp.sh

      - name: Fetch caption fonts
        run: ./scripts/fetch-fonts.sh

      - name: Verify bundled binaries
        run: |
          test -x resources/bin/whisper-cli || { echo "::error::whisper-cli missing"; exit 1; }
          test -x resources/bin/chopshop-vision || { echo "::error::chopshop-vision missing"; exit 1; }
          test -x resources/bin/yt-dlp || { echo "::error::yt-dlp missing"; exit 1; }
          # The renderer of record: its version decides how exports behave.
          "$(node -p "require('ffmpeg-static')")" -hide_banner -version | head -1

      # A test build is only made from work that passes every check.
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      # Signed ad hoc, not with the Developer ID: on GitHub's current Mac image
      # electron-builder's temporary keychain will not unlock ("SecKeychainUnlock:
      # The user name or passphrase you entered is not correct"), and a test build
      # for the owner does not need notarizing. Never published.
      - name: Build the app without publishing it
        timeout-minutes: 30
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-vite build
          npx electron-builder --mac --publish never -c.mac.identity=-

      # Graphics are drawn in the export by a native module. It must be in the
      # app, outside the asar, and load there, or every export with a graphic
      # would fail on the owner's Mac rather than here.
      - name: Check the graphics engine is in the app and loads
        run: |
          APP=$(ls -d release/mac-arm64/*.app | head -1)
          UNPACKED="$APP/Contents/Resources/app.asar.unpacked/node_modules/@napi-rs"
          find "$UNPACKED" -name '*.node' | grep -q . || { echo "::error::the graphics engine is missing from the app"; exit 1; }
          node -e "const c = require(require('path').resolve(process.argv[1], 'canvas')); const v = c.createCanvas(16, 16); v.getContext('2d').fillRect(0, 0, 16, 16); console.log('graphics engine loads in the packaged app:', v.toBuffer('image/png').length, 'byte PNG')" "$UNPACKED"

      - uses: actions/upload-artifact@v4
        with:
          name: cutalong-test-${{ github.run_number }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14
