name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  mac:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # resources/bin is gitignored, so without this the release would package
      # cleanly and ship an app whose transcription cannot start.
      - name: Build whisper.cpp
        run: ./scripts/build-whisper.sh

      - name: Verify bundled binaries
        run: |
          test -x resources/bin/whisper-cli || { echo "::error::whisper-cli missing"; exit 1; }
          test -f resources/fonts/ArchivoBlack-Regular.ttf || { echo "::error::caption font missing"; exit 1; }

      # electron-builder runs one publisher per target, and when the release
      # does not exist yet they race to create it: the loser's uploads vanish
      # and the release ends up missing latest-mac.yml, which silently breaks
      # updates for everyone already installed. Creating it up front means both
      # publishers only ever upload.
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set these two repo secrets once you have an Apple Developer ID and
          # macOS will install updates silently instead of falling back to the
          # "open releases page" banner. Passing them through directly does not
          # work: an empty CSC_LINK reads to electron-builder as a certificate
          # path of "", which fails the build.
          CERT_B64: ${{ secrets.CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CERT_B64" ]; then
            echo "Signing with the configured Developer ID certificate."
            export CSC_LINK="$CERT_B64"
            export CSC_KEY_PASSWORD="$CERT_PASSWORD"
          else
            echo "No certificate configured; building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run release

      # A release missing any of these looks fine on the releases page and is
      # broken for every updater that reads it.
      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$assets"
          for required in latest-mac.yml .dmg -mac.zip; do
            echo "$assets" | grep -q -- "$required" || {
              echo "::error::release $GITHUB_REF_NAME is missing $required"
              exit 1
            }
          done
