name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  mac:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # resources/bin is gitignored, so without this the release would package
      # cleanly and ship an app whose transcription cannot start.
      - name: Build whisper.cpp
        run: ./scripts/build-whisper.sh

      - name: Verify bundled binaries
        run: |
          test -x resources/bin/whisper-cli || { echo "::error::whisper-cli missing"; exit 1; }
          test -f resources/fonts/ArchivoBlack-Regular.ttf || { echo "::error::caption font missing"; exit 1; }

      # electron-builder runs one publisher per target, and when the release
      # does not exist yet they race to create it: the loser's uploads vanish
      # and the release ends up missing latest-mac.yml, which silently breaks
      # updates for everyone already installed. Creating it up front means both
      # publishers only ever upload.
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Build and publish
        id: build
        # Notarization waits on Apple with no timeout of its own, so a stalled
        # submission would hold the runner for six hours and then fail with
        # nothing useful in the log. Apple normally answers within fifteen
        # minutes; three times that is a stall worth failing on.
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set these two repo secrets once you have an Apple Developer ID and
          # macOS will install updates silently instead of falling back to the
          # "open releases page" banner. Passing them through directly does not
          # work: an empty CSC_LINK reads to electron-builder as a certificate
          # path of "", which fails the build.
          CERT_B64: ${{ secrets.CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Signing alone stops the updater failing, but a freshly downloaded
          # build is still refused by Gatekeeper until Apple has notarized it.
          # These three enable that; without them the build is signed only.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=""
          if [ -n "$CERT_B64" ]; then
            echo "Signing with the configured Developer ID certificate."
            export CSC_LINK="$CERT_B64"
            export CSC_KEY_PASSWORD="$CERT_PASSWORD"
            # Notarization needs something validly signed to submit, so it is
            # only ever switched on alongside a certificate.
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Notarizing with Apple as $APPLE_ID."
              extra="-c.mac.notarize=true"
              echo "notarized=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Signed but not notarized; a fresh download will be refused by Gatekeeper."
            fi
          else
            echo "No certificate configured; building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run release -- $extra

      # Notarization can report success while the ticket fails to attach, which
      # looks fine until the first machine without a cached result opens it.
      - name: Verify notarization
        if: steps.build.outputs.notarized == 'true'
        run: |
          for dmg in dist/*.dmg; do
            echo "Checking $dmg"
            xcrun stapler validate "$dmg"
          done

      # A release missing any of these looks fine on the releases page and is
      # broken for every updater that reads it.
      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$assets"
          for required in latest-mac.yml .dmg -mac.zip; do
            echo "$assets" | grep -q -- "$required" || {
              echo "::error::release $GITHUB_REF_NAME is missing $required"
              exit 1
            }
          done
