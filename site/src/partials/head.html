<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11110F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{root}}favicon.ico" sizes="32x32">
<link rel="icon" href="{{root}}icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">
<link rel="manifest" href="{{root}}site.webmanifest">
<link rel="preload" href="{{asset fonts/figtree.woff2}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{css}}">
<script>document.documentElement.classList.add('js')</script>
<script src="{{js}}" defer></script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cutalong">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{absasset img/og.png}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Cutalong mark and the words: The video editor you talk to.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{absasset img/twitter.png}}">
<meta name="twitter:image:alt" content="The Cutalong mark and the words: The video editor you talk to.">
