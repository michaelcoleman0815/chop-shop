<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ff6076; } a:hover { color: #ff7d8f; }
  </style>
</helmet>

<div style="width: 560px; height: 468px; background: #17171e; border: 1px solid #3d3d4a; border-radius: 4px; color: #f2f1ee; font-family: 'Sora', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 13px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 18px 22px 14px; border-bottom: 1px solid #2b2b35;">
    <div style="font-family: 'Archivo Black', system-ui, sans-serif; font-size: 18px; line-height: 1.1; letter-spacing: 0.01em;">New project</div>
  </div>

  <div style="padding: 20px 22px; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.16em; color: #98959f;">Name</div>
      <input type="text" value="Sunday service" style="font-family: 'Sora', system-ui, sans-serif; font-size: 13px; color: #f2f1ee; background: #08080b; border: 1px solid #57545c; border-radius: 3px; padding: 7px 9px; width: 100%; box-sizing: border-box;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.16em; color: #98959f;">What are you doing</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <div style="display: flex; flex-direction: column; gap: 3px; padding: 12px; background: rgba(255, 96, 118, 0.1); border: 1px solid #ff6076; border-radius: 3px;">
          <strong style="font-size: 13px; font-weight: 600;">Clipping</strong>
          <span style="font-size: 12px; line-height: 1.45; color: #98959f;">Find the moments in a long recording, caption them, cut the dead air.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; padding: 12px; background: #08080b; border: 1px solid #2b2b35; border-radius: 3px;">
          <strong style="font-size: 13px; font-weight: 600;">Editing</strong>
          <span style="font-size: 12px; line-height: 1.45; color: #98959f;">Work on a timeline with your own media, tracks and layers.</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.16em; color: #98959f;">Location</div>
      <div style="display: flex; gap: 7px;">
        <div style="flex-grow: 1; min-width: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #98959f; background: #08080b; border: 1px solid #2b2b35; border-radius: 3px; padding: 7px 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">~/Movies/Chop Shop/Projects</div>
        <button style="font-family: 'Sora', system-ui, sans-serif; font-size: 13px; font-weight: 500; color: #f2f1ee; background: #21212a; border: 1px solid #3d3d4a; border-radius: 3px; padding: 5px 11px; cursor: pointer;">Browse</button>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 22px; border-top: 1px solid #2b2b35;">
    <div style="flex-grow: 1;"></div>
    <button style="font-family: 'Sora', system-ui, sans-serif; font-size: 13px; font-weight: 500; color: #98959f; background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 5px 11px; cursor: pointer;">Cancel</button>
    <button style="font-family: 'Sora', system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #17090d; background: #ff6076; border: 1px solid #ff6076; border-radius: 3px; padding: 5px 14px; cursor: pointer;">Create</button>
  </div>
</div>
</x-dc>
</body>
</html>
