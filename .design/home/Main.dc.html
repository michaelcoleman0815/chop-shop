<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ff6076; } a:hover { color: #ff7d8f; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #101015; color: #f2f1ee; font-family: 'Sora', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 13px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 52px; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 0 24px 0 88px; border-bottom: 1px solid #2b2b35;">
    <svg width="26" height="22" viewBox="0 0 26 22" fill="none" aria-hidden="true">
      <rect x="0.5" y="1" width="25" height="8" rx="2" fill="#f2f1ee"></rect>
      <rect x="6.5" y="12" width="19" height="8" rx="2" fill="#ff6076"></rect>
    </svg>
    <span style="font-family: 'Archivo Black', system-ui, sans-serif; font-size: 15px; line-height: 1; letter-spacing: 0.05em; text-transform: uppercase;">Chop Shop</span>
    <div style="flex-grow: 1;"></div>
    <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f;">0.2.5</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex;">

    <div style="width: 240px; flex: 0 0 240px; background: #08080b; border-right: 1px solid #2b2b35; padding: 20px 16px; display: flex; flex-direction: column; gap: 7px;">
      <button style="width: 100%; text-align: left; font-family: 'Sora', system-ui, sans-serif; font-size: 14px; font-weight: 600; line-height: 1.3; color: #17090d; background: #ff6076; border: 1px solid #ff6076; border-radius: 3px; padding: 12px 16px; cursor: pointer;">New project</button>
      <button style="width: 100%; text-align: left; font-family: 'Sora', system-ui, sans-serif; font-size: 14px; font-weight: 500; line-height: 1.3; color: #f2f1ee; background: #21212a; border: 1px solid #3d3d4a; border-radius: 3px; padding: 12px 16px; cursor: pointer;">Open project</button>

      <div style="height: 1px; background: #2b2b35; margin: 16px 0 12px;"></div>

      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 3px; background: #21212a; color: #f2f1ee;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 8 2l6 4.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6.5Z"></path><path d="M6.2 14V9.2h3.6V14"></path></svg>
          <span style="font-weight: 500;">Home</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 3px; color: #98959f;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.6v1.8M8 12.6v1.8M14.4 8h-1.8M3.4 8H1.6M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3M12.5 12.5l-1.3-1.3M4.8 4.8 3.5 3.5"></path></svg>
          <span>Settings</span>
        </div>
      </div>

      <div style="flex-grow: 1;"></div>

      <div style="border-top: 1px solid #2b2b35; padding-top: 14px;">
        <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.16em; color: #98959f; margin-bottom: 7px;">On this Mac</div>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="display: flex; gap: 8px; font-size: 11px; line-height: 1.6;"><span style="width: 78px; flex: 0 0 78px;">Transcribe</span><span style="color: #98959f;">locally</span></div>
          <div style="display: flex; gap: 8px; font-size: 11px; line-height: 1.6;"><span style="width: 78px; flex: 0 0 78px;">Find clips</span><span style="color: #98959f;">Claude</span></div>
          <div style="display: flex; gap: 8px; font-size: 11px; line-height: 1.6;"><span style="width: 78px; flex: 0 0 78px;">Render</span><span style="color: #98959f;">ffmpeg, here</span></div>
        </div>
      </div>
    </div>

    <div style="flex-grow: 1; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px;">

      <div style="display: flex; align-items: baseline; gap: 16px;">
        <div style="font-family: 'Archivo Black', system-ui, sans-serif; font-size: 26px; line-height: 1.1; letter-spacing: 0.01em;">Recent</div>
        <div style="flex-grow: 1;"></div>
        <input type="text" placeholder="Filter projects" style="font-family: 'Sora', system-ui, sans-serif; font-size: 13px; color: #f2f1ee; background: #08080b; border: 1px solid #2b2b35; border-radius: 3px; padding: 5px 9px; width: 190px;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f;">3 projects</span>
      </div>

      <div style="display: flex; flex-direction: column;">

        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 116px 150px 96px; gap: 16px; padding-bottom: 9px; border-bottom: 1px solid #2b2b35; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.16em; color: #98959f;">
          <div style="display: flex; align-items: center; gap: 6px; color: #f2f1ee;">
            <span>Name</span>
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#ff6076" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8.2V1.8M2.4 5.6 5 8.2l2.6-2.6"></path></svg>
          </div>
          <div>Mode</div>
          <div>Opened</div>
          <div style="text-align: right;">Size</div>
        </div>

        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 116px 150px 96px; gap: 16px; align-items: center; padding: 13px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.045);">
          <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
            <div style="width: 34px; height: 20px; flex: 0 0 34px; border-radius: 2px; background: linear-gradient(155deg, #4a3a33, #2b2b35); border: 1px solid #2b2b35;"></div>
            <span style="font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">jijij</span>
          </div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #ff6076;">Clipping</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f;">4 min ago</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f; text-align: right;">1.6 MB</div>
        </div>

        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 116px 150px 96px; gap: 16px; align-items: center; padding: 13px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.045); background: #17171e; box-shadow: inset 2px 0 0 #ff6076;">
          <div style="display: flex; align-items: center; gap: 10px; min-width: 0; padding-left: 10px;">
            <div style="width: 34px; height: 20px; flex: 0 0 34px; border-radius: 2px; background: #08080b; border: 1px solid #2b2b35;"></div>
            <span style="font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">church</span>
          </div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #ff6076;">Clipping</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f;">2 days ago</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f; text-align: right;">346 B</div>
        </div>

        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 116px 150px 96px; gap: 16px; align-items: center; padding: 13px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.045);">
          <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
            <div style="width: 34px; height: 20px; flex: 0 0 34px; border-radius: 2px; background: linear-gradient(155deg, #4a3a33, #2b2b35); border: 1px solid #2b2b35;"></div>
            <span style="font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">ui</span>
          </div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #7fa8d4;">Editing</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f;">2 days ago</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f; text-align: right;">799 B</div>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
