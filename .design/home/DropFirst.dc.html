<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ff6076; } a:hover { color: #ff7d8f; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #101015; color: #f2f1ee; font-family: 'Sora', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 13px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 52px; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 0 24px 0 88px; border-bottom: 1px solid #2b2b35;">
    <svg width="26" height="22" viewBox="0 0 26 22" fill="none" aria-hidden="true">
      <rect x="0.5" y="1" width="25" height="8" rx="2" fill="#f2f1ee"></rect>
      <rect x="6.5" y="12" width="19" height="8" rx="2" fill="#ff6076"></rect>
    </svg>
    <span style="font-family: 'Archivo Black', system-ui, sans-serif; font-size: 15px; line-height: 1; letter-spacing: 0.05em; text-transform: uppercase;">Chop Shop</span>
    <div style="flex-grow: 1;"></div>
    <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f;">0.2.5</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex;">

    <div style="width: 60px; flex: 0 0 60px; background: #08080b; border-right: 1px solid #2b2b35; padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: #21212a; color: #f2f1ee;">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 8 2l6 4.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6.5Z"></path><path d="M6.2 14V9.2h3.6V14"></path></svg>
      </div>
      <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 3px; color: #98959f;">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 4.6a1 1 0 0 1 1-1h3.1l1.3 1.6h5a1 1 0 0 1 1 1v6.2a1 1 0 0 1-1 1h-9.4a1 1 0 0 1-1-1V4.6Z"></path></svg>
      </div>
      <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 3px; color: #98959f;">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.6"></circle><path d="M3.2 3.2a6.8 6.8 0 0 0 0 9.6M12.8 3.2a6.8 6.8 0 0 1 0 9.6"></path></svg>
      </div>
      <div style="flex-grow: 1;"></div>
      <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 3px; color: #98959f;">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.6v1.8M8 12.6v1.8M14.4 8h-1.8M3.4 8H1.6M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3M12.5 12.5l-1.3-1.3M4.8 4.8 3.5 3.5"></path></svg>
      </div>
    </div>

    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">

      <div style="padding: 56px 32px 40px; display: flex; flex-direction: column; align-items: center; gap: 22px;">
        <div style="font-family: 'Archivo Black', system-ui, sans-serif; font-size: 30px; line-height: 1.1; letter-spacing: 0.01em; text-align: center;">Drop a recording</div>

        <div style="width: 660px; padding: 44px 32px; display: flex; flex-direction: column; align-items: center; gap: 16px; background: #08080b; border: 1px dashed #3d3d4a; border-radius: 4px;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#57545c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V3.5"></path><path d="M7.5 8 12 3.5 16.5 8"></path><path d="M3.5 15.5v3a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-3"></path></svg>
          <div style="font-size: 13px; color: #98959f; text-align: center;">MP4, MOV, MKV, WebM &middot; up to 90 minutes</div>
          <div style="display: flex; gap: 8px;">
            <button style="font-family: 'Sora', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #17090d; background: #ff6076; border: 1px solid #ff6076; border-radius: 3px; padding: 10px 20px; cursor: pointer;">Choose a file</button>
            <button style="font-family: 'Sora', system-ui, sans-serif; font-size: 14px; font-weight: 500; color: #f2f1ee; background: #21212a; border: 1px solid #3d3d4a; border-radius: 3px; padding: 10px 20px; cursor: pointer;">Record the screen</button>
          </div>
        </div>

        <div style="font-size: 12px; color: #98959f;">or start an <a href="#" style="text-decoration: none;">editing project</a> with your own timeline</div>
      </div>

      <div style="flex-grow: 1; min-height: 0; padding: 0 32px 28px; display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; align-items: center; gap: 16px; border-top: 1px solid #2b2b35; padding-top: 22px;">
          <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.16em; color: #98959f;">Recent</span>
          <div style="flex-grow: 1;"></div>
          <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f;">3 projects</span>
        </div>

        <div style="display: flex; flex-direction: column;">
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 116px 150px 96px; gap: 16px; align-items: center; padding: 11px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.045);">
            <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
              <div style="width: 52px; height: 30px; flex: 0 0 52px; border-radius: 2px; background: linear-gradient(155deg, #5a4438, #23222b); border: 1px solid #2b2b35;"></div>
              <span style="font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">jijij</span>
            </div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #ff6076;">Clipping</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f;">4 min ago</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f; text-align: right;">8 clips</div>
          </div>
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 116px 150px 96px; gap: 16px; align-items: center; padding: 11px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.045);">
            <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
              <div style="width: 52px; height: 30px; flex: 0 0 52px; border-radius: 2px; background: #08080b; border: 1px solid #2b2b35;"></div>
              <span style="font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">church</span>
            </div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #ff6076;">Clipping</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f;">2 days ago</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #4a4753; text-align: right;">no media</div>
          </div>
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 116px 150px 96px; gap: 16px; align-items: center; padding: 11px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.045);">
            <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
              <div style="width: 52px; height: 30px; flex: 0 0 52px; border-radius: 2px; background: linear-gradient(155deg, #5a4438, #23222b); border: 1px solid #2b2b35;"></div>
              <span style="font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">ui</span>
            </div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #7fa8d4;">Editing</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f;">2 days ago</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: #98959f; text-align: right;">1 sequence</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
